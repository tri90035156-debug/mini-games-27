.score{display:flex;flex-direction:column;align-items:center;line-height:1}

#stage{flex:1;min-height:0;margin-top:8px}

.sp.fade{animation:fade .45s steps(2) infinite}
@keyframes popin{0%{transform:scale(0)}100%{transform:scale(1)}}

function sticker(id, x, y, w, rot, ay=0.5, sym=''){
  const it=ITEMS[id], vb=(it.vb||'0 0 40 40').split(' ').map(Number), h=w*vb[3]/vb[2];
  const art = id==='laptop' ? `<use href="#${sym||'lapGreen'}"/>` : ART[id];
  return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(1)})" class="sticker"><svg x="${(-w/2).toFixed(1)}" y="${(-h*ay).toFixed(1)}" width="${w}" height="${h.toFixed(1)}" viewBox="${vb.join(' ')}" overflow="visible">${art}</svg></g>`;
}
// worn = [{id, rot, jx, color}] in tap order; everything stacks, nothing gets replaced
function layout(worn){
  const L={back:[],pet:[],feet:[],waist:[],neck:[],face:[],mouth:[],hand:[],laptop:[],head:[],cloud:[]}, n={};
  let headTop=34;
  for(const it of worn){
    const d=ITEMS[it.id], a=d.a, k=(n[a]=(n[a]||0)+1)-1, r=it.rot, j=it.jx;
    if(a==='head'){
      if(it.id==='dino' && k===0){ L.head.push(sticker('dino',80,50,96,r*.3)); headTop=8; continue; }
      const y=headTop+6; L.head.push(sticker(it.id,80+j,y,d.w,r,.86)); headTop=y-d.w*0.62*0.86; continue; }
    if(a==='face') { L.face.push(sticker(it.id,80+j*.3,65-k*5,d.w,r*.4)); continue; }
    if(a==='mouth'){ L.mouth.push(sticker(it.id,80,80+k*4,d.w,r*.5)); continue; }
    if(a==='neck') { L.neck.push(sticker(it.id,80+j*.5,114+k*10,d.w,r*.4,.3)); continue; }
    if(a==='waist'){ L.waist.push(sticker(it.id,80,168-k*14,d.w,r*.3)); continue; }
    if(a==='hand'){ const right=k%2===0, m=Math.floor(k/2), sx=right?1:-1;
      L.hand.push(sticker(it.id,(right?118:42)+sx*m*12,(d.ay?172:160)-m*10,d.w,sx*(m*14)+r*.5,d.ay||.5)); continue; }
    if(a==='back'){ const right=k%2===0, m=Math.floor(k/2), sx=right?1:-1;
      L.back.push(sticker(it.id,80+sx*(34+m*10),120-m*16,d.w,sx*(12+m*8)+r*.3)); continue; }
    if(a==='feet') { L.feet.push(sticker(it.id,80,250-k*3,d.w,r*.3)); continue; }
    if(a==='pet')  { const P=[[0,236],[160,236],[-20,212],[180,212]][k%4]; L.pet.push(sticker(it.id,P[0],P[1]-Math.floor(k/4)*20,d.w,r*.3)); continue; }
    if(a==='laptop'){ const P=[[128,196],[32,196],[134,170],[26,170]][k%4]; L.laptop.push(sticker('laptop',P[0],P[1]-Math.floor(k/4)*24,d.w,r*.4,.5,it.color)); continue; }
    if(a==='cloud'){ L.cloud.push({k,r}); continue; }
  }
  const clouds = L.cloud.map(({k,r})=>sticker('cloud',80+(k%2?1:-1)*Math.ceil(k/2)*30,headTop-22-Math.floor(k/2)*4,60,r*.3)).join('');
  return {L, clouds, headTop};
}
function totalKg(worn){ return worn.reduce((s,it)=>s+(ITEMS[it.id].g||0),0)/1000; }
function dollSVG(gender, worn, face, cls='doll'){
  const kg=totalKg(worn), squash=Math.min(.08,kg*.0028);
  const {L,clouds,headTop}=layout(worn);
  const top=Math.min(-12, headTop-52);
  const vb=`-44 ${top.toFixed(0)} 248 ${(274-top).toFixed(0)}`;
  return `<svg class="${cls}" viewBox="${vb}" preserveAspectRatio="xMidYMax meet" aria-hidden="true">${L.back.join('')}${L.pet.join('')}${baseDoll(gender,face,squash)}${L.feet.join('')}${L.waist.join('')}${L.neck.join('')}${L.face.join('')}${L.mouth.join('')}${L.hand.join('')}${L.laptop.join('')}${L.head.join('')}${clouds}</svg>`;
}
function faceFor(kg){ return kg<4?'smile':kg<10?'wow':kg<18?'strain':'dizzy'; }

// ---------- sound ----------
let ac=null;
function tone(f1,f2=f1*1.5,dur=.12,type='sine',vol=.06){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain(); o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur*.8); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur);}catch(e){} }
const buzz=ms=>{ try{ navigator.vibrate&&navigator.vibrate(ms);}catch(e){} };

// ---------- 搭配圖鑑（只存在這台裝置） ----------
let dex=new Set(); try{ dex=new Set(JSON.parse(localStorage.getItem('acer-outfit-combos')||'[]')); }catch(e){}
const saveDex=()=>{ try{ localStorage.setItem('acer-outfit-combos',JSON.stringify([...dex])); }catch(e){} };

// ---------- game state ----------
let gender='f', worn=[], score=100, streak=0, lastTap=0, found=[], lapColor=null, tEnd=0, running=false, spawnT=0, tickT=0, faceOverride=null, faceT=0, sayT=0, lapShown=false, kgSaid=0;
const stage=$('stage');

function renderStart(){
  const demo=[{id:'crown',rot:-6,jx:0},{id:'cat',rot:8,jx:3},{id:'shades',rot:0,jx:0},{id:'lei',rot:0,jx:0},{id:'boba',rot:0,jx:0},{id:'balloon',rot:-4,jx:0},{id:'box',rot:0,jx:0}];
  $('startStage').innerHTML=dollSVG(gender,demo,'wow');
  $('gF').classList.toggle('on',gender==='f'); $('gM').classList.toggle('on',gender==='m');
  $('dexStart').textContent=`搭配圖鑑 ${dex.size}/${COMBOS.length}・找出隱藏搭配有加分`;
}
function renderDoll(){
  const kg=totalKg(worn);
  stage.querySelectorAll('svg.doll').forEach(s=>s.remove());
  stage.insertAdjacentHTML('afterbegin', dollSVG(gender,worn,faceOverride||faceFor(kg)));
  const svg=stage.querySelector('svg.doll'); svg.classList.toggle('wobble',kg>=10); svg.classList.toggle('hard',kg>=18);
  $('cnt').textContent=worn.filter(w=>!ITEMS[w.id].bad).length; $('kg').textContent=kg.toFixed(1);
  $('kgbar').style.width=Math.min(100,kg/25*100)+'%';
}
function setScore(v){ score=Math.max(0,v); const b=$('score'); b.textContent=score.toLocaleString()+'%'; b.classList.add('bump'); setTimeout(()=>b.classList.remove('bump'),120); }
function say(text){ const s=$('say'); s.textContent=text; s.classList.add('on'); clearTimeout(sayT); sayT=setTimeout(()=>s.classList.remove('on'),1500); }
function plus(text,x,y,bad){ const p=document.createElement('span'); p.className='plus'+(bad?' bad':''); p.textContent=text; p.style.left=x+'px'; p.style.top=y+'px'; stage.appendChild(p); setTimeout(()=>p.remove(),1000); }
function banner(small,big,cls=''){ const b=$('banner'); b.className='banner '+cls; b.innerHTML=`<small>${small}</small><b>${big}</b>`; void b.offsetWidth; b.classList.add('on'); clearTimeout(b._t); b._t=setTimeout(()=>b.classList.remove('on'),1300); }
function renderFoundDots(){ $('foundDots').innerHTML=COMBOS.map(c=>`<i class="${found.includes(c.id)?'on':''}"></i>`).join(''); }

function start(){ gaEvent('game_start');
  running=false; clearTimeout(spawnT); clearTimeout(tickT);
  worn=[]; score=100; streak=0; found=[]; lapColor=null; lapShown=false; kgSaid=0; faceOverride=null;
  stage.querySelectorAll('.sp,.plus,.fly,.countdown').forEach(e=>e.remove());
  show('play'); renderDoll(); setScore(100); $('streak').textContent='連穿 ×0'; renderFoundDots();
  $('timer').textContent='⏰ 0:20'; $('timer').classList.remove('warn'); $('hint').textContent='點冒出來的東西就會穿上身';
  const cd=document.createElement('div'); cd.className='countdown'; stage.appendChild(cd);
  let n=3; const step=()=>{ if(n===0){ cd.remove(); go(); return; } cd.textContent=n; tone(520,520,.08,'square',.03); n--; setTimeout(step,550); }; step();
}
function go(){
  running=true; tEnd=performance.now()+ROUND_MS; tone(660,990,.15);
  spawn(); setTimeout(spawn,250); scheduleSpawn(); tick();
}
function scheduleSpawn(){ clearTimeout(spawnT); if(!running) return; spawnT=setTimeout(()=>{ spawn(); scheduleSpawn(); }, 420+Math.random()*320); }
function tick(){
  if(!running) return;
  const left=Math.max(0,tEnd-performance.now()), s=Math.ceil(left/1000);
  $('timer').textContent='⏰ 0:'+String(s).padStart(2,'0'); $('timer').classList.toggle('warn',left<=5000);
  if(left<=0) return end();
  tickT=setTimeout(tick,100);
}
function pickId(){
  const elapsed=ROUND_MS-(tEnd-performance.now());
  // 發光的 Swift Air 14：每輪 7～13 秒之間一定出現一次，之後偶爾再出現
  if(!lapShown && elapsed>7000 && (Math.random()<.12 || elapsed>13000)) { lapShown=true; return 'laptop'; }
  if(lapShown && Math.random()<.04) return 'laptop';
  if(elapsed>2500 && Math.random()<.16) return Math.random()<.5?'ot':'boss';
  return NORMAL[Math.floor(Math.random()*NORMAL.length)];
}
function spawn(){
  if(!running) return;
  const live=stage.querySelectorAll('.sp:not(.gone)'); if(live.length>=5) return;
  const id=pickId(), it=ITEMS[id], W=stage.clientWidth, H=stage.clientHeight;
  let x=0,y=0;
  for(let t=0;t<12;t++){ x=40+Math.random()*(W-80); y=40+Math.random()*(H-90);
    if([...live].every(e=>Math.hypot(parseFloat(e.style.left)-x,parseFloat(e.style.top)-y)>74)) break; }
  const b=document.createElement('button'); b.className='sp'+(it.bad?' bad':'')+(it.rare?' rare':'')+((it.vb||'').endsWith(' 80')?' tall':'')+(id==='ring'||id==='lei'||id==='corgi'?' wide':'');
  b.style.left=x+'px'; b.style.top=y+'px'; b.dataset.id=id;
  const color = id==='laptop' ? LAP_COLORS[Math.floor(Math.random()*3)] : null;
  if(color) b.dataset.color=color.sym;
  b.innerHTML=`<svg viewBox="${it.vb||'0 0 40 40'}" class="sticker">${id==='laptop'?`<use href="#${color.sym}"/>`:ART[id]}</svg>`;
  b.setAttribute('aria-label',it.name);
  b.addEventListener('pointerdown',e=>{ e.preventDefault(); tapItem(b); });
  stage.appendChild(b);
  const life = it.rare ? 1500 : 1900+Math.random()*700;
  b._t1=setTimeout(()=>b.classList.add('fade'), life-500);
  b._t2=setTimeout(()=>{ b.classList.add('gone'); setTimeout(()=>b.remove(),220); }, life);
}
function anchorPoint(){
  const svg=stage.querySelector('svg.doll'), s=stage.getBoundingClientRect(), r=svg?svg.getBoundingClientRect():s;
  return {x:r.left-s.left+r.width/2, y:r.top-s.top+r.height*.55};
}
function tapItem(b){
  if(!running || b.classList.contains('gone')) return;
  clearTimeout(b._t1); clearTimeout(b._t2); b.classList.add('gone'); setTimeout(()=>b.remove(),200);
  const id=b.dataset.id, it=ITEMS[id], x=parseFloat(b.style.left), y=parseFloat(b.style.top);
  const f=document.createElement('div'); f.className='fly'; f.innerHTML=b.innerHTML; f.style.left=x+'px'; f.style.top=y+'px'; stage.appendChild(f);
  const ap=anchorPoint(); requestAnimationFrame(()=>{ f.style.left=ap.x+'px'; f.style.top=ap.y+'px'; f.style.transform='scale(.6)'; });
  setTimeout(()=>f.remove(),270);
  const now=performance.now();
  if(it.bad){
    streak=0; $('streak').textContent='連穿 ×0';
    worn.push({id, rot:(Math.random()*2-1)*10, jx:0});
    setScore(score+it.p); plus(`${it.name} ${it.p}`,x,y-20,true); say(it.line);
    faceOverride='sad'; clearTimeout(faceT); faceT=setTimeout(()=>{faceOverride=null; renderDoll();},1400);
    tone(220,140,.25,'square',.04); buzz([40,30,40]);
    setTimeout(renderDoll,200); return;
  }
  streak = (now-lastTap<1100) ? streak+1 : 1; lastTap=now;
  const pts=Math.round(it.p*(1+Math.min(streak-1,10)*0.1));
  const entry={id, rot:(Math.random()*2-1)*12, jx:(Math.random()*2-1)*4};
  if(id==='laptop'){ entry.color=b.dataset.color; lapColor=LAP_COLORS.find(c=>c.sym===b.dataset.color); }
  worn.push(entry);
  setScore(score+pts); $('streak').textContent=`連穿 ×${streak}`;
  plus(`+${pts}`,x,y-20);
  if(id==='laptop'){ banner('接到了！',`Swift Air 14 ${lapColor.name}`,'go'); say('只有 1.19kg，好輕！'); tone(880,1760,.25,'triangle',.07); }
  else if(it.line && Math.random()<.7) say(it.line);
  tone(500+Math.min(streak,12)*60, 900+Math.min(streak,12)*80, .1); buzz(12);
  const kg=totalKg(worn);
  for(const [t,l] of [[5,'有點重……'],[10,'我還撐得住！'],[15,'腰要斷了'],[20,'這是搬家吧？']]){ if(kg>=t && kgSaid<t){ kgSaid=t; say(l); } }
  setTimeout(()=>{ renderDoll(); checkCombos(); },200);
}
function checkCombos(){
  const w={}; for(const it of worn){ w[it.id]=(w[it.id]||0)+1; if(ITEMS[it.id].a==='head') w._head=(w._head||0)+1; }
  for(const c of COMBOS){
    if(found.includes(c.id) || !c.need(w)) continue;
    found.push(c.id); const isNew=!dex.has(c.id); dex.add(c.id); saveDex();
    setScore(score+c.bonus); banner(isNew?'NEW COMBO！':'COMBO！',`${c.name} +${c.bonus}`);
    tone(660,1320,.18,'triangle',.07); setTimeout(()=>tone(990,1980,.2,'triangle',.06),140); buzz([20,40,20]);
    renderFoundDots(); $('hint').textContent=`找到「${c.name}」！`;
    break;
  }
}
function end(){
  running=false; clearTimeout(spawnT); clearTimeout(tickT);
  stage.querySelectorAll('.sp').forEach(b=>{ clearTimeout(b._t1); clearTimeout(b._t2); b.classList.add('gone'); });
  $('timer').textContent='⏰ 0:00'; $('timer').classList.remove('warn');
  banner('時間到','出門！','go'); tone(523,784,.2,'triangle',.06);
  setTimeout(result,1200);
}

// ---------- result ----------
let res=null;
function result(){
  const n=worn.filter(w=>!ITEMS[w.id].bad).length, kg=totalKg(worn), bads=worn.length-n;
  const best=COMBOS.filter(c=>found.includes(c.id)).sort((a,b)=>b.bonus-a.bonus)[0];
  const title = best ? best.name+'系' : n>=16?'全身家當系':n>=10?'行動倉庫系':n>=5?'隨手一抓系':n>=1?'輕裝出門系':'什麼都沒穿系';
  res={title,n,kg,col:lapColor};
  $('title').textContent=title;
  $('endStage').innerHTML=dollSVG(gender,worn,kg>=18?'dizzy':'proud');
  $('sN').textContent=n; $('sKg').textContent=kg.toFixed(1); $('sR').textContent=score.toLocaleString()+'%';
  $('combos').innerHTML=COMBOS.map(c=>{ const got=found.includes(c.id), known=dex.has(c.id); return `<span class="${got?'on new':known?'on':''}">${known?c.name:'？？？'}</span>`; }).join('');
  const heavy = kg>=1.19 ? `全身扛了 ${kg.toFixed(1)}kg 出門，還好 <b>Swift Air 14 只有 1.19kg</b>。` : `<b>Swift Air 14 只有 1.19kg</b>，帶著出門剛剛好。`;
  const colTxt = lapColor ? `你接到的<span class="match" style="background:${lapColor.hex}"></span><b>${lapColor.name}</b>就是你的本命色。` : `下次接住那台發光的 Swift Air 14，看看你的本命色。`;
  $('copy').innerHTML = heavy + (bads?`（還順手接了 ${bads} 通加班，辛苦了。）`:'') + '<br>' + colTxt;
  gaEvent('game_complete',{score,items:n,kg:+kg.toFixed(1)});
  show('end'); tone(660,990,.15); setTimeout(()=>tone(990,1320,.2),150);
}
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),1800); }
async function storyPNG(){
  const defs=document.querySelector('svg.defs').innerHTML, W=1080, H=1920, r=res;
  const doll=dollSVG(gender,worn,r.kg>=18?'dizzy':'proud','x').replace('<svg class="x"','<svg x="90" y="420" width="900" height="1000"');
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${defs}
  <style>.sticker{filter:drop-shadow(0 4px 6px rgba(59,47,51,.18))}</style>
  <rect width="${W}" height="${H}" fill="#FAF7F2"/><circle cx="980" cy="200" r="380" fill="${PINK}"/><circle cx="60" cy="1700" r="420" fill="${GREEN}"/>
  <text x="540" y="230" text-anchor="middle" font-family="PingFang TC,Noto Sans TC,sans-serif" font-size="40" letter-spacing="8" fill="#8C7F84">今日出門鑑定</text>
  <text x="540" y="330" text-anchor="middle" font-family="PingFang TC,Noto Sans TC,sans-serif" font-size="84" font-weight="900" fill="${INK}">${r.title}</text>
  ${doll}
  <text x="540" y="1520" text-anchor="middle" font-family="PingFang TC,Noto Sans TC,sans-serif" font-size="44" font-weight="700" fill="${INK}">身上 ${r.n} 件｜負重 ${r.kg.toFixed(1)}kg｜回頭率 ${score.toLocaleString()}%</text>
  <text x="540" y="1600" text-anchor="middle" font-family="PingFang TC,Noto Sans TC,sans-serif" font-size="38" fill="${BURG}">${r.col?`我的本命色：Swift Air 14 ${r.col.name}`:'還好 Swift Air 14 只有 1.19kg'}</text>
  <text x="540" y="1790" text-anchor="middle" font-family="Arial,sans-serif" font-size="56" font-weight="900" fill="#83B81A">acer</text></svg>`;
  const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
  const img=new Image(); await new Promise((ok,no)=>{img.onload=ok; img.onerror=no; img.src=url;});
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H; cv.getContext('2d').drawImage(img,0,0); URL.revokeObjectURL(url);
  return await new Promise(ok=>cv.toBlob(ok,'image/png'));
}
function showSheet(blob){ $('sheetImg').src=URL.createObjectURL(blob); $('sheet').hidden=false; }
$('sheetClose').onclick=()=>{ $('sheet').hidden=true; };
$('save').onclick=async()=>{ gaEvent('share_click',{method:'story_image'});
  const text=`我今天是「${res.title}」，身上掛了 ${res.n} 件出門！`;
  try{ navigator.clipboard.writeText(text).catch(()=>{}); }catch(e){}
  let blob; try{ blob=await storyPNG(); }catch(e){ toast('存圖失敗，再試一次'); return; }
  const file=new File([blob],'今天穿這樣出門.png',{type:'image/png'});
  try{ if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],text}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  showSheet(blob);
};
$('gF').onclick=()=>{ gender='f'; renderStart(); };
$('gM').onclick=()=>{ gender='m'; renderStart(); };
$('go').onclick=start; $('again').onclick=start;
$('more').onclick=()=>gaEvent('product_click',{product:'Swift Air 14',link_url:$('more').href});
renderStart();
})();
</script>
</body></html>
