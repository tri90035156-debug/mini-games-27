<title>秤重大挑戰</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--page:#F2F2F2;--scr:#FFFFFF;--ink:#1A1A1A;--mute:#6B6B6B;--line:#E3E3E3;--acc:#83B81A;--acc-ink:#fff;--acc-dk:#5F8A12;--r:12px;
--sh:0 1px 2px rgba(26,26,26,.06),0 8px 24px rgba(26,26,26,.06);--sh-h:0 1px 2px rgba(26,26,26,.08),0 12px 32px rgba(26,26,26,.10);
--sh-acc:0 1px 2px rgba(95,138,18,.22),0 8px 24px rgba(131,184,26,.24);--sh-acc-h:0 2px 4px rgba(95,138,18,.24),0 12px 32px rgba(131,184,26,.30)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Noto Sans TC","PingFang TC",sans-serif;background:var(--page);color:var(--ink);display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;overflow:hidden}
.defs{position:absolute;width:0;height:0;overflow:hidden}
.app{position:relative;width:100%;max-width:400px;height:100%;background:var(--scr);overflow:hidden;user-select:none;-webkit-user-select:none}
@media (min-width:520px) and (min-height:700px){.app{height:min(860px,calc(100dvh - 48px));border-radius:36px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 24px 56px rgba(0,0,0,.12)}}
.view{position:absolute;inset:0;display:none;flex-direction:column;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom))}
.view.on{display:flex}
.logo{font-weight:900;font-size:22px;line-height:24px;letter-spacing:-.02em;color:var(--acc)}
.k{font-size:12px;line-height:16px;letter-spacing:.14em;font-weight:700;color:var(--mute)}
.h{font-size:32px;font-weight:900;line-height:40px;margin:8px 0}
.p{font-size:14px;line-height:24px;color:var(--mute)}
.foot{margin-top:16px;font-size:11px;line-height:16px;color:var(--mute);text-align:center}
.c{text-align:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:56px;border:0;width:100%;font:inherit;font-weight:900;font-size:17px;border-radius:var(--r);background:var(--acc);color:var(--acc-ink);box-shadow:var(--sh-acc);cursor:pointer;touch-action:manipulation;transition:transform .15s,box-shadow .15s,filter .15s}
@media (hover:hover){.btn:hover{transform:translateY(-1px);box-shadow:var(--sh-acc-h);filter:brightness(1.04)}}
.btn:active{transform:translateY(1px);box-shadow:0 1px 2px rgba(95,138,18,.24);filter:brightness(.94)}
.btn:focus-visible{outline:3px solid rgba(131,184,26,.4);outline-offset:2px}
.btn.o{height:48px;background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:700;font-size:15px;box-shadow:var(--sh)}
@media (hover:hover){.btn.o:hover{box-shadow:var(--sh-h);filter:none}}
.btn.o:active{background:#F4F4F4;filter:none}
a.btn{text-decoration:none}
.btn.t{height:40px;background:transparent;box-shadow:none;color:var(--ink);font-weight:700;font-size:14px}
.btn.t svg{color:var(--acc)}
.btns{display:flex;flex-direction:column;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;font-size:13px;line-height:16px;font-weight:700;border-radius:99px;background:var(--acc);color:var(--acc-ink);box-shadow:var(--sh-acc);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.l{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:var(--sh)}
.chip.warn{background:#1A1A1A;color:#fff;box-shadow:none}
.chips{display:flex;gap:8px;justify-content:center}
.top{display:flex;justify-content:space-between;align-items:center}
.card{background:#fff;border:1px solid #EDEDED;border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.prod{display:flex;align-items:center;gap:16px}.prod svg{flex:none;display:block}.prod .p{color:var(--ink)}
/* progress */
.prog{margin-top:16px}
.track{position:relative;height:8px;border-radius:99px;background:#EDEDED;overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:99px}
.track:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(16.6667% - 2px),#fff calc(16.6667% - 2px) 16.6667%)}
.ticks{display:flex;justify-content:space-between;margin-top:4px}
.ticks i{width:1px;height:4px;background:#CFCFCF}.ticks i.m{height:8px;background:#9A9A9A}
.tl{display:flex;justify-content:space-between;font-size:11px;line-height:16px;color:var(--mute)}
.dots{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:12px;height:12px}
.dots i{width:8px;height:8px;border-radius:50%;background:#E3E3E3;transition:all .2s}
.dots i.ok{background:var(--acc)}
.dots i.ng{background:#fff;box-shadow:inset 0 0 0 1.5px #BDBDBD}
.dots i.cur{width:12px;height:12px;background:var(--acc);box-shadow:0 0 0 4px rgba(131,184,26,.18)}
/* start */
.hero{display:flex;justify-content:center;margin-top:16px}.hero svg{display:block}
.cap{text-align:center;font-size:14px;line-height:24px;font-weight:700}
.cap small{display:block;font-size:11px;line-height:16px;color:var(--mute);font-weight:400}
.hint{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px;padding:8px 12px;border-radius:var(--r);background:#F7F7F7;font-size:12px;line-height:16px;font-weight:700;color:var(--mute)}
.hint b{display:inline-flex;align-items:center;gap:4px;color:var(--ink)}.hint b.r{color:var(--acc-dk)}
.hint svg{display:inline-block;vertical-align:middle}
/* stack */
.stack{position:relative;flex:1;min-height:250px;max-height:500px;margin-top:12px}
.sc{position:absolute;left:12px;right:12px;top:0;bottom:16px;border-radius:20px;background:#fff;border:1px solid #EDEDED;box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;align-items:center}
.sc.b2{transform:translateY(16px) scale(.9);opacity:.55}
.sc.b1{transform:translateY(8px) scale(.95);opacity:.85}
.sc.cur{box-shadow:var(--sh-h);cursor:grab;touch-action:none;will-change:transform}
.sc.cur.drag{cursor:grabbing;transition:none}
.sc.cur.back{transition:transform .25s cubic-bezier(.2,.8,.3,1.2)}
.sc.cur.fly{transition:transform .28s ease-in,opacity .28s ease-in}
.sc .no{align-self:flex-start;font-size:11px;line-height:16px;font-weight:700;color:var(--mute);letter-spacing:.08em}
.sc .art{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;pointer-events:none}
.sc .art svg{display:block;max-height:100%}
.sc .emo{font-size:min(168px,21vh);line-height:1;filter:drop-shadow(0 8px 12px rgba(0,0,0,.12))}
.sc b{font-size:17px;line-height:24px;text-align:center}
.sc .vsl{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);width:100%;justify-content:center;font-size:12px;line-height:16px;color:var(--mute)}
.sc .vsl svg{display:block}
.sc .vsl b{font-size:14px;color:var(--acc-dk)}
.stamp{position:absolute;top:28px;padding:4px 12px;border:3px solid var(--acc);border-radius:8px;color:var(--acc);font-size:20px;line-height:28px;font-weight:900;letter-spacing:.04em;background:rgba(255,255,255,.92);opacity:0;pointer-events:none;white-space:nowrap}
.stamp.r{left:16px;transform:rotate(-14deg)}
.stamp.l{right:16px;transform:rotate(14deg);border-color:#1A1A1A;color:#1A1A1A}
.reveal{position:absolute;left:12px;right:12px;top:0;bottom:16px;border-radius:20px;display:flex;flex-direction:column;text-align:center;overflow:hidden;background:#fff;border:4px solid var(--acc);box-shadow:var(--sh-h);opacity:0;transform:scale(1.14) rotate(-3deg);pointer-events:none;transition:opacity .1s,transform .18s cubic-bezier(.2,1.5,.4,1)}
.reveal.on{opacity:1;transform:none}
.reveal.ng{border-color:#E5484D}
.rv-h{background:var(--acc);color:#fff;font-size:36px;line-height:44px;font-weight:900;padding:12px 0;letter-spacing:.06em}
.reveal.ng .rv-h{background:#E5484D}
.rv-c{flex:1;min-height:0;display:grid;grid-template-columns:1fr 22px 1fr;align-items:center;padding:8px 6px 0}
.rv-s{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 2px 16px;border-radius:14px;border:2px solid #EDEDED;min-width:0}
.rv-s .pic{height:84px;display:flex;align-items:center;justify-content:center;font-size:66px;line-height:1}
.rv-s .pic svg{display:block}
.rv-s .nm{font-size:13px;line-height:18px;font-weight:700;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rv-s .wt{font-size:44px;line-height:52px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.rv-s .wt small{font-size:18px;margin-left:1px}
.rv-s .wt.k{font-size:36px;letter-spacing:-.04em}
.rv-s .tg{font-size:13px;line-height:24px;font-weight:900;padding:0 12px;border-radius:99px;background:#EDEDED;color:var(--mute)}
.rv-s.lap .wt{color:var(--acc-dk)}
.rv-s.lap .tg{background:var(--acc);color:#fff}
.rv-s.hv{background:#1A1A1A;border-color:#1A1A1A}.rv-s.hv .nm{color:#CFCFCF}.rv-s.hv .wt{color:#fff}.rv-s.hv .tg{background:#fff;color:#1A1A1A}
.rv-s.lap.hv .wt{color:#B6E356}
.rv-x{font-size:20px;font-weight:900;text-align:center}
.rv-n{font-size:16px;line-height:22px;font-weight:900;padding:8px 12px 14px}
.snd{position:absolute;top:max(20px,env(safe-area-inset-top));right:20px;height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:12px;font-weight:700;box-shadow:var(--sh);cursor:pointer;z-index:5}
.swipebtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.swipebtns .btn{height:52px;font-size:14px}
/* result */
.big{font-size:72px;font-weight:900;line-height:72px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big-u{display:inline-block;position:relative;padding-bottom:8px}
.big-u:after{content:"";position:absolute;left:4px;right:4px;bottom:0;height:2px;border-radius:2px;background:var(--acc)}
.big .unit{font-size:24px;line-height:32px;color:var(--mute);letter-spacing:0;font-weight:700;margin-left:4px}
.award{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:16px}
.stars{display:flex;gap:8px;height:24px;align-items:center}
.st svg{display:block;fill:#fff;stroke:#CFCFCF;stroke-width:1.5}.st.on svg{fill:var(--acc);stroke:var(--acc)}
.badge{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 16px;border-radius:99px;background:rgba(131,184,26,.08);border:1px solid var(--acc);font-weight:700;font-size:13px}
.say{font-size:17px;line-height:24px;font-weight:900;margin-top:16px;text-align:center}
.mini{display:flex;justify-content:center;gap:4px;margin-top:16px}
.mini i{width:20px;height:28px;border-radius:4px;background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(26,26,26,.06);position:relative}
.mini i.ok{border-color:var(--acc);background:rgba(131,184,26,.10)}
.mini i.ok:after{content:"";position:absolute;left:6px;top:9px;width:6px;height:3px;border-left:2px solid var(--acc);border-bottom:2px solid var(--acc);transform:rotate(-45deg)}
.mini i.ng:after,.mini i.ng:before{content:"";position:absolute;left:9px;top:8px;width:2px;height:12px;background:#BDBDBD;transform:rotate(45deg)}
.mini i.ng:before{transform:rotate(-45deg)}
.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,16px);background:#1A1A1A;color:#fff;font-size:13px;line-height:20px;padding:8px 16px;border-radius:99px;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.chip.warn{animation:pulse .6s infinite}

let ac=null, out=null, muted=false; const bufs={};
try{ muted=localStorage.getItem('acer-games-muted')==='1'; }catch(e){}
function audioInit(){
  if(ac){ if(ac.state==='suspended') ac.resume(); return true; }
  try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return false; }
  const comp=ac.createDynamicsCompressor(); out=ac.createGain(); out.gain.value=.9; out.connect(comp); comp.connect(ac.destination);
  for(const k in SFX_DATA){ try{ const bin=atob(SFX_DATA[k]), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    ac.decodeAudioData(u.buffer, b=>{ bufs[k]=b; }, ()=>{ delete SFX_DATA[k]; }); }catch(e){ delete SFX_DATA[k]; } }
  return true;
}
function note(f,t,d,type='sine',v=.25,f2){ const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(out); o.start(t); o.stop(t+d+.02); return o; }
function hiss(t,d,v=.3,f1=2000,f2){ const n=Math.ceil(ac.sampleRate*d), b=ac.createBuffer(1,n,ac.sampleRate), ch=b.getChannelData(0); for(let i=0;i<n;i++) ch[i]=Math.random()*2-1;
  const s=ac.createBufferSource(), fl=ac.createBiquadFilter(), g=ac.createGain(); s.buffer=b; fl.type='bandpass'; fl.Q.value=1.2; fl.frequency.setValueAtTime(f1,t); if(f2) fl.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); s.connect(fl); fl.connect(g); g.connect(out); s.start(t); }
function wob(o,t,d,rate,depth){ const l=ac.createOscillator(), lg=ac.createGain(); l.frequency.value=rate; lg.gain.value=depth; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t+d+.02); }
const SYNTH={
 start:t=>[523,659,784,1047].forEach((f,i)=>note(f,t+i*.08,.16,'triangle',.28)),
 finish:t=>{ [523,659,784].forEach((f,i)=>note(f,t+i*.1,.14,'triangle',.28)); [1047,1319,1568].forEach(f=>note(f,t+.32,.6,'triangle',.2)); },
 swipe:t=>hiss(t,.16,.25,900,3600),
 stamp:t=>{ note(140,t,.22,'sine',.7,45); hiss(t,.05,.5,1800); },

 pop:(t,r)=>note(420*r,t,.09,'sine',.4,980*r),

 powerup:t=>{ note(440,t,.3,'triangle',.25,1760); [1319,1661,2093].forEach((f,i)=>note(f,t+.22+i*.06,.25,'sine',.16)); },
 beep:t=>note(880,t,.1,'sine',.28),

function sfx(name,{rate=1,vol=1}={},again){ if(muted||!audioInit()) return;
  try{ const b=bufs[name]; if(b){ const s=ac.createBufferSource(), g=ac.createGain(); s.buffer=b; s.playbackRate.value=rate; g.gain.value=vol; s.connect(g); g.connect(out); s.start(); }
    else if(SFX_DATA[name]&&!again) setTimeout(()=>sfx(name,{rate,vol},1),90); /* 第一聲：音檔還在解碼，等一下再播 */
    else if(SYNTH[name]) SYNTH[name](ac.currentTime+.005,rate); }catch(e){} }
function bindSound(btn){ const draw=()=>{ btn.textContent=muted?'🔇 音效關':'🔊 音效開'; btn.setAttribute('aria-pressed',String(!muted)); }; draw();
  btn.onclick=()=>{ muted=!muted; try{ localStorage.setItem('acer-games-muted',muted?'1':'0'); }catch(e){} draw(); if(!muted) sfx('pop'); }; }
const buzz = ms => { try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };

// ---------- state ----------
let qs=[], idx=0, results=[], left=TOTAL_MS, last=0, running=false, busy=false, raf=0, lastTick=0;

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pickQuestions(){
  const fixed = POOL.filter(p=>p.fixed), rest = shuffle(POOL.filter(p=>!p.fixed));
  const heavy = rest.filter(p=>p.g>LAPTOP_W), light = rest.filter(p=>p.g<LAPTOP_W);
  // 大約一半一半，避免全猜同一邊
  return shuffle([...fixed, ...heavy.slice(0,3), ...light.slice(0,5)]).slice(0,TOTAL_Q);
}

function start(){ gaEvent('game_start');
  qs = pickQuestions(); idx=0; results=[]; left=TOTAL_MS; busy=false;
  show('play'); renderDots(); renderStack(); updateClock();
  running=true; last=performance.now(); cancelAnimationFrame(raf); raf=requestAnimationFrame(tick);
  sfx('start'); lastTick=0;
}
function tick(now){
  if(!running) return;
  if(!busy){ left -= now-last; }
  last = now;
  if(left<=0){ left=0; updateClock(); return finish(); }
  updateClock();
  raf=requestAnimationFrame(tick);
}
function updateClock(){
  const s = Math.ceil(left/1000);
  $('tleft').textContent = '0:'+String(s).padStart(2,'0');
  $('tbar').style.width = (100-left/TOTAL_MS*100)+'%';
  $('clock').classList.toggle('warn', left<=5000 && left>0);
  if(running && left<=5000 && left>0 && s!==lastTick){ lastTick=s; sfx('tick'); }
}
function renderDots(){
  $('dots').innerHTML = qs.map((_,i)=>{
    const r = results[i]; const c = r===true?'ok':r===false?'ng':(i===idx?'cur':'');
    return `<i class="${c}"></i>`; }).join('');
  $('qno').textContent = `第 ${Math.min(idx+1,TOTAL_Q)}/${TOTAL_Q} 題`;
}
function cardHTML(q,i){
  const art = q.art ? q.art : `<span class="emo">${q.emo}</span>`;
  return `<span class="no">${String(i+1).padStart(2,'0')} / ${TOTAL_Q}</span><div class="art">${art}</div><b>${q.name}・${q.sub}</b>

   <span class="stamp r">它比較重！</span><span class="stamp l">筆電比較重！</span>`;
}
let card=null;
function renderStack(){
  const st=$('stack'); st.innerHTML='';
  if(idx+2<qs.length){ const b=document.createElement('div'); b.className='sc b2'; st.appendChild(b); }
  if(idx+1<qs.length){ const b=document.createElement('div'); b.className='sc b1'; st.appendChild(b); }
  card=document.createElement('div'); card.className='sc cur'; card.innerHTML=cardHTML(qs[idx],idx); st.appendChild(card);
  const rv=document.createElement('div'); rv.className='reveal'; rv.id='reveal'; st.appendChild(rv);
  bindDrag(card);
}

// ---------- drag / swipe ----------
function setDrag(dx){
  card.style.transform = `translateX(${dx}px) rotate(${dx/14}deg)`;
  const r = card.querySelector('.stamp.r'), l = card.querySelector('.stamp.l');
  r.style.opacity = Math.max(0,Math.min(1,dx/80)); l.style.opacity = Math.max(0,Math.min(1,-dx/80));
}
function bindDrag(el){
  let sx=0, dx=0, t0=0, active=false, id=null;
  el.addEventListener('pointerdown', e=>{ if(busy) return; active=true; id=e.pointerId; sx=e.clientX; dx=0; t0=performance.now(); el.classList.add('drag'); el.classList.remove('back'); try{el.setPointerCapture(id);}catch(_){} });
  el.addEventListener('pointermove', e=>{ if(!active||e.pointerId!==id) return; dx=e.clientX-sx; setDrag(dx); });
  const end = e=>{ if(!active||e.pointerId!==id) return; active=false; el.classList.remove('drag');
    const v = Math.abs(dx)/Math.max(1,performance.now()-t0);
    if(Math.abs(dx)>90 || (Math.abs(dx)>40 && v>0.6)) answer(dx>0?'heavier':'lighter');
    else { el.classList.add('back'); setDrag(0); } };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}
function answer(choice){
  if(busy||!running) return; busy=true;
  const q=qs[idx], heavier=q.g>LAPTOP_W, ok=(choice==='heavier')===heavier;
  results[idx]=ok;
  // fly out
  card.classList.remove('back'); card.classList.add('fly');
  const dir = choice==='heavier'?1:-1;
  setDrag(dir*60);
  requestAnimationFrame(()=>{ card.style.transform=`translateX(${dir*520}px) rotate(${dir*24}deg)`; card.style.opacity='0'; });
  sfx('swipe'); buzz(ok?15:[30,40,30]);
  const rv=$('reveal'); rv.classList.toggle('ng',!ok);
  const diff=Math.abs(q.g-LAPTOP_W), pic=q.sart||q.emo;
  // 一秒看懂：對或錯（整塊色條）＋兩個重量並排，重的那邊反黑
  rv.innerHTML = `<div class="rv-h">${ok?'✓ 答對！':'✕ 答錯！'}</div>
   <div class="rv-c">
    <div class="rv-s lap${heavier?'':' hv'}"><div class="pic"><svg width="116" height="81"><use href="#lap"/></svg></div><span class="nm">Swift Air 16</span><b class="wt">999<small>g</small></b><span class="tg">${heavier?'比較輕':'比較重'}</span></div>
    <div class="rv-x">${heavier?'＜':'＞'}</div>
    <div class="rv-s${heavier?' hv':''}"><div class="pic">${pic}</div><span class="nm">${q.name}</span><b class="wt${q.g>=1000?' k':''}">${q.g.toLocaleString()}<small>g</small></b><span class="tg">${heavier?'比較重':'比較輕'}</span></div>
   </div>
   <div class="rv-n">${q.note || `${heavier?q.name:'Swift Air 16 '}重了 ${diff.toLocaleString()}g`}</div>`;
  setTimeout(()=>{ rv.classList.add('on'); sfx('stamp'); setTimeout(()=>sfx(ok?'correct':'wrong'),130); },120);
  renderDots();
  setTimeout(()=>{
    idx++;
    if(idx>=TOTAL_Q) return finish();
    busy=false; renderDots(); renderStack();
  }, 1700);
}
$('bl').onclick=()=>answer('lighter'); $('br').onclick=()=>answer('heavier');
document.addEventListener('keydown',e=>{
  if(!views.play.classList.contains('on')) return;
  if(e.key==='ArrowLeft') answer('lighter'); if(e.key==='ArrowRight') answer('heavier');
});

// ---------- result ----------
const STAR='<svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 2.6l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8Z" stroke-linejoin="round"/></svg>';
let lastScore=0;
function finish(){
  running=false; cancelAnimationFrame(raf);
  const score = results.filter(r=>r===true).length; lastScore=score; gaEvent('game_complete',{score});
  const nStar = score>=9?3:score>=6?2:1;
  const [title,say] = score===10?['人肉電子秤・滿分','滿分！你的手就是電子秤']
    : score>=8?['人肉電子秤','重量感很準，差一點滿分']
    : score>=6?['手感不錯','重量感還不錯，再一輪就滿分']
    : score>=4?['手感暖機中','有些東西比你想的還輕']
    : ['萬物皆重','你覺得什麼都很重，筆電除外'];
  $('score').textContent=score; $('title').textContent=title; $('say').textContent=say;
  $('stars').innerHTML=[0,1,2].map(i=>`<span class="st${i<nStar?' on':''}">${STAR}</span>`).join('');
  $('mini').innerHTML=Array.from({length:TOTAL_Q},(_,i)=>`<i class="${results[i]===true?'ok':results[i]===false?'ng':''}"></i>`).join('');
  setTimeout(()=>{ show('end'); sfx('finish'); },300);
}
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),1800); }
$('go').onclick=start; $('again').onclick=start; bindSound($('snd'));
$('share').onclick=async()=>{ gaEvent('share_click');
  const text=`我在「秤重大挑戰」滑對 ${lastScore}/10！原來 Swift Air 16 只有 999g，比裝滿的 600ml 水壺還輕。你猜得出來嗎？`;
  let copied=false; try{ await navigator.clipboard.writeText(text); copied=true; }catch(e){}
  try{ if(navigator.share){ await navigator.share({title:'秤重大挑戰',text}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  toast(copied?'已複製分享文字，貼到 IG／LINE 就好':'分享文字：'+text.slice(0,18)+'…');
};
$('more').onclick=()=>gaEvent('product_click',{product:'Swift Air 16',link_url:$('more').href});
})();
</script>
</body></html>
