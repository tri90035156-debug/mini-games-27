   &lt;span class=&quot;stamp r&quot;&gt;它比較重！&lt;/span&gt;&lt;span class=&quot;stamp l&quot;&gt;筆電比較重！&lt;/span&gt;`;

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;box-shadow:var(--sh)}
/* viewfinder */
.vf{position:relative;border-radius:4px;overflow:hidden;background:radial-gradient(circle at 50% 50%,#151a10 0,#0B0B0B 70%);touch-action:manipulation;cursor:crosshair}
.vf .cn{position:absolute;width:20px;height:20px;border:2px solid var(--acc);z-index:3}
.vf .cn.a{top:8px;left:8px;border-right:0;border-bottom:0}.vf .cn.b{top:8px;right:8px;border-left:0;border-bottom:0}
.vf .cn.c{bottom:8px;left:8px;border-right:0;border-top:0}.vf .cn.d{bottom:8px;right:8px;border-left:0;border-top:0}
.vf .rec{position:absolute;top:12px;left:36px;font-size:11px;line-height:16px;color:#fff;display:flex;align-items:center;gap:6px;letter-spacing:.1em;z-index:3}
.vf .rec i{width:8px;height:8px;border-radius:50%;background:#FF4D3A;box-shadow:0 0 8px #FF4D3A;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.vf .xh{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border:1px solid rgba(155,224,40,.5);border-radius:50%;z-index:1}
.vf .xh:before,.vf .xh:after{content:&quot;&quot;;position:absolute;background:rgba(155,224,40,.5)}
.vf .xh:before{left:50%;top:-10px;bottom:-10px;width:1px}.vf .xh:after{top:50%;left:-10px;right:-10px;height:1px}
.mystery{filter:brightness(0) drop-shadow(0 0 1px #9BE028) drop-shadow(0 0 6px rgba(155,224,40,.6))}
.qm{position:absolute;font-size:40px;line-height:48px;font-weight:900;color:var(--acc);text-shadow:0 0 12px rgba(155,224,40,.6)}
#runner{position:absolute;top:50%;left:0;width:168px;height:104px;margin-top:-52px;z-index:2;pointer-events:none;display:none}
#runner .g1,#runner .g2{position:absolute;inset:0;filter:url(#mblur)}
#runner .g1{opacity:.3;transform:translateX(-56px)}#runner .g2{opacity:.14;transform:translateX(-112px)}
#runner .streak{position:absolute;right:120px;height:3px;border-radius:2px;background:linear-gradient(90deg,rgba(155,224,40,0),rgba(155,224,40,.9))}
#runner svg{position:absolute;inset:0;display:block}
#runner .body{transform:rotate(-4deg)}
.snd{position:absolute;top:max(28px,calc(env(safe-area-inset-top) + 16px));right:28px;height:32px;padding:0 12px;border-radius:99px;border:1px solid #333;background:#171717;color:#F3F3F3;font:inherit;font-size:12px;font-weight:700;cursor:pointer;z-index:5}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
.flash.on{animation:flash .35s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.msg{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:4px 12px;border-radius:4px;font-size:13px;line-height:20px;font-weight:900;letter-spacing:.06em;white-space:nowrap;z-index:4;display:none}
.msg.on{display:block}
.msg.tap{background:var(--acc);color:var(--acc-ink);box-shadow:0 0 16px rgba(155,224,40,.6)}
.msg.bad{background:#FF4D3A;color:#fff}
.msg.wait{background:#1E1E1E;color:var(--mute);border:1px solid #333}
.snap{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:4;background:rgba(11,11,11,.55)}
.snap.on{display:flex}
.snap .pz{width:72%;padding:8px 8px 0;background:#F6F6F2;border-radius:4px;transform:rotate(-3deg) scale(.6);opacity:0;transition:transform .3s cubic-bezier(.2,.9,.3,1.3),opacity .2s;box-shadow:0 12px 32px rgba(0,0,0,.6)}
.snap.on .pz{transform:rotate(-3deg) scale(1);opacity:1}
.snap .pz .ph{background:#0E120B;border-radius:2px;position:relative}
.snap .pz svg{display:block;width:100%;height:auto}
.snap .pz .cp{display:flex;justify-content:space-between;color:#1A1A1A;font-size:12px;line-height:28px;font-weight:700}
.snap .pz .cp span{color:#5F8A12}
.timer{font-size:48px;line-height:56px;font-weight:700;color:var(--acc);text-shadow:0 0 16px rgba(155,224,40,.4);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.timer small{font-size:20px;color:var(--mute);margin-left:2px}
.timer.idle{color:#3A3A3A;text-shadow:none}
.shutterbar{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.thumb{width:48px;height:48px;border-radius:8px;border:1px solid #333;background:#151515;overflow:hidden;display:flex;align-items:center;justify-content:center}
.thumb svg{display:block}
.shutter{width:88px;height:88px;border-radius:50%;border:3px solid var(--acc);display:flex;align-items:center;justify-content:center;box-shadow:0 0 24px rgba(155,224,40,.35);cursor:pointer;background:none;touch-action:manipulation;padding:0}
.shutter i{width:68px;height:68px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;color:var(--acc-ink);font-style:normal;font-weight:900;font-size:13px;letter-spacing:.06em;transition:transform .08s}
.shutter:active i,.shutter.press i{transform:scale(.86);filter:brightness(.9)}
.dex{display:flex;flex-direction:column;align-items:center;gap:2px;width:48px;font-size:11px;line-height:16px;color:var(--mute)}
.dex b{font-size:14px;color:var(--ink)}
.rounds{display:flex;gap:6px;justify-content:center;margin-top:12px}
.rounds i{width:28px;height:4px;border-radius:2px;background:#2A2A2A}.rounds i.hit{background:var(--acc)}.rounds i.miss{background:#5A2A26}.rounds i.cur{background:#777}
/* result */
.pol{width:228px;margin:16px auto 0;padding:10px 10px 0;background:#F6F6F2;border-radius:4px;transform:rotate(-3deg);box-shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5);position:relative}
.pol .ph{position:relative;height:140px;background:#0E120B;border-radius:2px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.pol .ph svg{display:block}
.pol .cap{display:flex;justify-content:space-between;align-items:center;height:36px;color:#1A1A1A;font-size:13px;line-height:16px;font-weight:700}
.pol .cap span{font-size:11px;color:#8A8A8A;font-weight:400}
.pol .ts{position:absolute;right:8px;bottom:6px;font-size:11px;line-height:16px;color:var(--acc);letter-spacing:.06em}
.tape{position:absolute;top:-10px;left:50%;width:64px;height:20px;margin-left:-32px;background:rgba(155,224,40,.55);transform:rotate(4deg)}
.big{font-size:56px;line-height:56px;font-weight:700;color:var(--acc);letter-spacing:-.03em;text-shadow:0 0 16px rgba(155,224,40,.35);font-variant-numeric:tabular-nums}
.big small{font-size:22px;color:var(--mute);margin-left:2px}
.badge{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:4px;border:1px solid var(--acc);background:rgba(155,224,40,.08);font-weight:700;font-size:13px}
.badge svg{display:block}
.toast{position:absolute;left:50%;bottom:110px;transform:translate(-50%,16px);background:var(--acc);color:var(--acc-ink);font-size:13px;font-weight:700;line-height:20px;padding:8px 16px;border-radius:4px;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sheet{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;background:rgba(0,0,0,.75)}
.sheet[hidden]{display:none}
.sheet img{display:block;max-width:100%;max-height:68%;border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.4)}
.sheet p{color:#fff;font-size:14px;line-height:22px;text-align:center}
.sheet .btn{max-width:200px}

function note(f,t,d,type=&#x27;sine&#x27;,v=.25,f2){ const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(out); o.start(t); o.stop(t+d+.02); return o; }
function hiss(t,d,v=.3,f1=2000,f2){ const n=Math.ceil(ac.sampleRate*d), b=ac.createBuffer(1,n,ac.sampleRate), ch=b.getChannelData(0); for(let i=0;i&lt;n;i++) ch[i]=Math.random()*2-1;
  const s=ac.createBufferSource(), fl=ac.createBiquadFilter(), g=ac.createGain(); s.buffer=b; fl.type=&#x27;bandpass&#x27;; fl.Q.value=1.2; fl.frequency.setValueAtTime(f1,t); if(f2) fl.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); s.connect(fl); fl.connect(g); g.connect(out); s.start(t); }
function wob(o,t,d,rate,depth){ const l=ac.createOscillator(), lg=ac.createGain(); l.frequency.value=rate; lg.gain.value=depth; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t+d+.02); }
const SYNTH={
 start:t=&gt;[523,659,784,1047].forEach((f,i)=&gt;note(f,t+i*.08,.16,&#x27;triangle&#x27;,.28)),
 finish:t=&gt;{ [523,659,784].forEach((f,i)=&gt;note(f,t+i*.1,.14,&#x27;triangle&#x27;,.28)); [1047,1319,1568].forEach(f=&gt;note(f,t+.32,.6,&#x27;triangle&#x27;,.2)); },
 swipe:t=&gt;hiss(t,.16,.25,900,3600),
 stamp:t=&gt;{ note(140,t,.22,&#x27;sine&#x27;,.7,45); hiss(t,.05,.5,1800); },
 correct:t=&gt;{ note(784,t,.12,&#x27;triangle&#x27;,.3); note(1175,t+.1,.3,&#x27;triangle&#x27;,.3); note(2349,t+.1,.25,&#x27;sine&#x27;,.08); },
 wrong:t=&gt;{ note(155,t,.38,&#x27;sawtooth&#x27;,.22); note(110,t,.38,&#x27;sawtooth&#x27;,.22); },
 tick:t=&gt;note(1100,t,.04,&#x27;square&#x27;,.12),
 shutter:t=&gt;{ hiss(t,.035,.6,3200); hiss(t+.07,.05,.5,2200); note(90,t+.07,.06,&#x27;sine&#x27;,.3); },
 zoom:t=&gt;{ hiss(t,.35,.3,400,4200); note(260,t,.35,&#x27;sine&#x27;,.12,1500); },
 squeal:t=&gt;{ const o=note(900,t,.4,&#x27;sine&#x27;,.3,1900); wob(o,t,.4,28,90); },
 raspberry:t=&gt;{ const o=note(95,t,.45,&#x27;sawtooth&#x27;,.3,70); wob(o,t,.45,34,40); },
 boing:t=&gt;{ const o=note(180,t,.5,&#x27;sine&#x27;,.35,520); wob(o,t,.5,18,60); },
 trombone:t=&gt;[233,220,208,196].forEach((f,i)=&gt;{ const o=note(f,t+i*.2,i===3?.5:.19,&#x27;sawtooth&#x27;,.2); if(i===3) wob(o,t+i*.2,.5,6,6); }),
 slip:t=&gt;note(1300,t,.4,&#x27;sine&#x27;,.3,180),
 pop:(t,r)=&gt;note(420*r,t,.09,&#x27;sine&#x27;,.4,980*r),
 bad:t=&gt;{ note(220,t,.32,&#x27;square&#x27;,.2,70); hiss(t,.12,.25,500); },
 combo:t=&gt;[659,831,988,1319,1661].forEach((f,i)=&gt;note(f,t+i*.055,.22,&#x27;triangle&#x27;,.24)),
 powerup:t=&gt;{ note(440,t,.3,&#x27;triangle&#x27;,.25,1760); [1319,1661,2093].forEach((f,i)=&gt;note(f,t+.22+i*.06,.25,&#x27;sine&#x27;,.16)); },
 beep:t=&gt;note(880,t,.1,&#x27;sine&#x27;,.28),
 ring:t=&gt;{ for(let i=0;i&lt;8;i++) note(i%2?480:440,t+i*.05,.05,&#x27;square&#x27;,.14); },
};
function sfx(name,{rate=1,vol=1}={},again){ if(muted||!audioInit()) return;
  try{ const b=bufs[name]; if(b){ const s=ac.createBufferSource(), g=ac.createGain(); s.buffer=b; s.playbackRate.value=rate; g.gain.value=vol; s.connect(g); g.connect(out); s.start(); }
    else if(SFX_DATA[name]&amp;&amp;!again) setTimeout(()=&gt;sfx(name,{rate,vol},1),90); /* 第一聲：音檔還在解碼，等一下再播 */
    else if(SYNTH[name]) SYNTH[name](ac.currentTime+.005,rate); }catch(e){} }
function bindSound(btn){ const draw=()=&gt;{ btn.textContent=muted?&#x27;🔇 音效關&#x27;:&#x27;🔊 音效開&#x27;; btn.setAttribute(&#x27;aria-pressed&#x27;,String(!muted)); }; draw();
  btn.onclick=()=&gt;{ muted=!muted; try{ localStorage.setItem(&#x27;acer-games-muted&#x27;,muted?&#x27;1&#x27;:&#x27;0&#x27;); }catch(e){} draw(); if(!muted) sfx(&#x27;pop&#x27;); }; }
const buzz = ms =&gt; { try{ navigator.vibrate &amp;&amp; navigator.vibrate(ms); }catch(e){} };

// 圖鑑（只存在這台裝置的瀏覽器裡）
let dex = new Set();
try{ dex = new Set(JSON.parse(localStorage.getItem(&#x27;acer-shutter-dex&#x27;)||&#x27;[]&#x27;)); }catch(e){}
const saveDex = () =&gt; { try{ localStorage.setItem(&#x27;acer-shutter-dex&#x27;, JSON.stringify([...dex])); }catch(e){} };
const dexText = () =&gt; `${dex.size}/${CRITTERS.length}`;
$(&#x27;dexStart&#x27;).textContent = &#x27;圖鑑 &#x27;+dexText();

let round=0, shots=[], state=&#x27;idle&#x27;, t0=0, raf=0, waitT=0, nextT=0, critter=null, dur=0, newFinds=[];
const runner=$(&#x27;runner&#x27;), vf=$(&#x27;vf&#x27;), bodyEl=runner.querySelector(&#x27;.body&#x27;), g1El=runner.querySelector(&#x27;.g1&#x27;), g2El=runner.querySelector(&#x27;.g2&#x27;);

function setMsg(text, cls){ const m=$(&#x27;msg&#x27;); m.textContent=text; m.className=&#x27;msg on &#x27;+cls; }
function clearMsg(){ $(&#x27;msg&#x27;).className=&#x27;msg&#x27;; }
function setTimer(ms, idle){ $(&#x27;timer&#x27;).innerHTML=(ms/1000).toFixed(3)+&#x27;&lt;small&gt;s&lt;/small&gt;&#x27;; $(&#x27;timer&#x27;).classList.toggle(&#x27;idle&#x27;,!!idle); }
function renderRounds(){
  $(&#x27;rounds&#x27;).innerHTML = Array.from({length:ROUNDS},(_,i)=&gt;{ const s=shots[i]; return `&lt;i class=&quot;${s?(s.ms!=null?&#x27;hit&#x27;:&#x27;miss&#x27;):(i===round?&#x27;cur&#x27;:&#x27;&#x27;)}&quot;&gt;&lt;/i&gt;`; }).join(&#x27;&#x27;);
  $(&#x27;round&#x27;).textContent = `ROUND ${Math.min(round+1,ROUNDS)}/${ROUNDS}`;
  const hits = shots.filter(s=&gt;s&amp;&amp;s.ms!=null).map(s=&gt;s.ms);
  $(&#x27;best&#x27;).textContent = hits.length ? `BEST ${Math.min(...hits)}ms` : &#x27;BEST ---&#x27;;
  $(&#x27;dexPlay&#x27;).textContent = dexText();
}

function start(){ gaEvent(&#x27;game_start&#x27;);
  round=0; shots=[]; newFinds=[]; $(&#x27;thumb&#x27;).innerHTML=&#x27;&#x27;;
  show(&#x27;play&#x27;); renderRounds(); nextRound(); sfx(&#x27;start&#x27;);
}
function nextRound(){
  clearTimeout(waitT); clearTimeout(nextT); cancelAnimationFrame(raf);
  if(round&gt;=ROUNDS) return finish();
  renderRounds(); $(&#x27;snap&#x27;).classList.remove(&#x27;on&#x27;); runner.style.display=&#x27;none&#x27;; clearMsg();
  state=&#x27;wait&#x27;; setTimer(0,true);
  $(&#x27;status&#x27;).textContent=&#x27;準備……盯著取景框&#x27;;
  setMsg(&#x27;等牠出現…&#x27;,&#x27;wait&#x27;);
  waitT = setTimeout(appear, 1100 + Math.random()*2400);
}
function appear(){
  critter = CRITTERS[Math.floor(Math.random()*CRITTERS.length)];
  [&#x27;ug2&#x27;,&#x27;ug1&#x27;,&#x27;ub&#x27;].forEach(id=&gt;$(id).setAttribute(&#x27;href&#x27;,&#x27;#&#x27;+critter.id));
  dur = 720 - round*45;                     // 一回比一回快
  runner.style.top = (38 + Math.random()*24)+&#x27;%&#x27;;
  runner.style.display=&#x27;block&#x27;; clearMsg();
  state=&#x27;run&#x27;; t0=performance.now();
  $(&#x27;status&#x27;).textContent=&#x27;牠出現了！&#x27;;
  sfx(&#x27;zoom&#x27;);
  raf=requestAnimationFrame(run);
}
function run(now){
  if(state!==&#x27;run&#x27;) return;
  const el=now-t0, W=vf.clientWidth, p=el/dur, x = -170 + (W+340)*p;
  // 每隻怪咖跑法不一樣：扭、跳、轉、滾、倒退嚕、抖
  let dy=0, rot=-4, sx=1;
  switch(critter.mv){
    case &#x27;wiggle&#x27;: dy=Math.sin(p*20)*10; rot=Math.sin(p*20+1)*12; break;
    case &#x27;hop&#x27;:    dy=-Math.abs(Math.sin(p*13))*28; rot=Math.sin(p*13)*9; break;
    case &#x27;spin&#x27;:   rot=p*1080; dy=Math.sin(p*9)*8; break;
    case &#x27;roll&#x27;:   rot=p*720; dy=-Math.abs(Math.sin(p*9))*6; break;
    case &#x27;moon&#x27;:   sx=-1; rot=8; dy=Math.sin(p*11)*4; break;
    case &#x27;shake&#x27;:  dy=(Math.random()-.5)*12; rot=(Math.random()-.5)*20; break;
  }
  runner.style.transform=`translate(${x}px,${dy}px)`;
  bodyEl.style.transform=`scaleX(${sx}) rotate(${rot}deg)`;
  g1El.style.transform=`translateX(-56px) scaleX(${sx}) rotate(${rot*.85}deg)`;
  g2El.style.transform=`translateX(-112px) scaleX(${sx}) rotate(${rot*.7}deg)`;
  setTimer(el);
  if(el&gt;=dur){ return escaped(); }
  raf=requestAnimationFrame(run);
}
function escaped(){
  state=&#x27;done&#x27;; runner.style.display=&#x27;none&#x27;;
  shots[round]={ms:null, c:critter};
  setMsg(&#x27;跑掉了……只拍到尾巴&#x27;,&#x27;bad&#x27;); $(&#x27;status&#x27;).textContent=&#x27;MISS&#x27;; sfx(&#x27;trombone&#x27;);
  buzz(60); round++; nextT=setTimeout(nextRound,1300);
}
function fire(){
  $(&#x27;shutter&#x27;).classList.add(&#x27;press&#x27;); setTimeout(()=&gt;$(&#x27;shutter&#x27;).classList.remove(&#x27;press&#x27;),120);
  if(state===&#x27;wait&#x27;){
    clearTimeout(waitT); state=&#x27;done&#x27;;
    setMsg(&#x27;太早了！拍到空氣&#x27;,&#x27;bad&#x27;); $(&#x27;status&#x27;).textContent=&#x27;再來一次這回合&#x27;; sfx(&#x27;slip&#x27;); buzz(80);
    nextT=setTimeout(nextRound,1100); return;
  }
  if(state!==&#x27;run&#x27;) return;
  const ms = Math.round(performance.now()-t0);
  state=&#x27;done&#x27;; cancelAnimationFrame(raf);
  sfx(&#x27;shutter&#x27;); buzz(25); const cs=critter.snd; setTimeout(()=&gt;sfx(cs,{rate:.9+Math.random()*.3}),170);
  const f=$(&#x27;flash&#x27;); f.classList.remove(&#x27;on&#x27;); void f.offsetWidth; f.classList.add(&#x27;on&#x27;);
  setTimer(ms);
  shots[round]={ms, c:critter};
  if(!dex.has(critter.id)){ dex.add(critter.id); newFinds.push(critter.id); saveDex(); }
  $(&#x27;snapUse&#x27;).setAttribute(&#x27;href&#x27;,&#x27;#&#x27;+critter.face); $(&#x27;snapName&#x27;).textContent=critter.name; $(&#x27;snapMs&#x27;).textContent=(ms/1000).toFixed(3)+&#x27;s&#x27;;
  setTimeout(()=&gt;{ runner.style.display=&#x27;none&#x27;; $(&#x27;snap&#x27;).classList.add(&#x27;on&#x27;); },140);
  $(&#x27;status&#x27;).textContent = ms&lt;200?&#x27;神速！&#x27;:ms&lt;260?&#x27;拍到了！&#x27;:&#x27;差點跑掉！&#x27;;
  $(&#x27;thumb&#x27;).innerHTML=`&lt;svg width=&quot;48&quot; height=&quot;35&quot; viewBox=&quot;0 0 220 160&quot;&gt;&lt;use href=&quot;#${critter.face}&quot;/&gt;&lt;/svg&gt;`;
  round++; renderRounds();
  nextT=setTimeout(nextRound,1500);
}
$(&#x27;shutter&#x27;).addEventListener(&#x27;pointerdown&#x27;,e=&gt;{e.preventDefault();fire();});
vf.addEventListener(&#x27;pointerdown&#x27;,e=&gt;{e.preventDefault();fire();});
document.addEventListener(&#x27;keydown&#x27;,e=&gt;{ if(views.play.classList.contains(&#x27;on&#x27;) &amp;&amp; (e.code===&#x27;Space&#x27;||e.key===&#x27;Enter&#x27;)){ e.preventDefault(); fire(); } });

function rankOf(ms){
  const pct = Math.max(1, Math.min(99, Math.round(100-(ms-140)*0.45)));
  const t = ms&lt;180?&#x27;神之手指&#x27;:ms&lt;230?&#x27;電競反應&#x27;:ms&lt;300?&#x27;正常人類&#x27;:&#x27;樹懶模式&#x27;;
  return {pct,t};
}
let bestShot=null;
function finish(){
  state=&#x27;idle&#x27;; clearTimeout(waitT); clearTimeout(nextT); cancelAnimationFrame(raf);
  const hits = shots.filter(s=&gt;s&amp;&amp;s.ms!=null);
  bestShot = hits.sort((a,b)=&gt;a.ms-b.ms)[0] || null;
  const ph=$(&#x27;polPh&#x27;);
  if(bestShot){
    const r=rankOf(bestShot.ms), avg=Math.round(hits.reduce((a,s)=&gt;a+s.ms,0)/hits.length);
    ph.innerHTML=`&lt;svg width=&quot;184&quot; height=&quot;134&quot; viewBox=&quot;0 0 220 160&quot;&gt;&lt;use href=&quot;#${bestShot.c.face}&quot;/&gt;&lt;/svg&gt;&lt;span class=&quot;ts mono&quot;&gt;${(bestShot.ms/1000).toFixed(3)}s&lt;/span&gt;`;
    $(&#x27;polName&#x27;).textContent=bestShot.c.name+&#x27;・被你抓包&#x27;;
    $(&#x27;polNo&#x27;).textContent=&#x27;#&#x27;+String(CRITTERS.indexOf(bestShot.c)+1).padStart(2,&#x27;0&#x27;);
    $(&#x27;bigMs&#x27;).innerHTML=bestShot.ms+&#x27;&lt;small&gt;ms&lt;/small&gt;&#x27;;
    $(&#x27;rank&#x27;).textContent=`${r.t}・比 ${r.pct}% 玩家快`;
    $(&#x27;sum&#x27;).textContent=`拍到 ${hits.length}/${ROUNDS} 隻・平均 ${avg}ms`;
    $(&#x27;speedLab&#x27;).textContent=&#x27;你的指速（最快一張）&#x27;;
  } else {
    ph.innerHTML=`&lt;svg width=&quot;184&quot; height=&quot;115&quot; viewBox=&quot;0 0 200 124&quot; style=&quot;filter:url(#mblur);opacity:.6&quot;&gt;&lt;use href=&quot;#fish&quot;/&gt;&lt;/svg&gt;&lt;span class=&quot;ts mono&quot;&gt;MISS&lt;/span&gt;`;
    $(&#x27;polName&#x27;).textContent=&#x27;一團殘影&#x27;; $(&#x27;polNo&#x27;).textContent=&#x27;#--&#x27;;
    $(&#x27;bigMs&#x27;).innerHTML=&#x27;---&lt;small&gt;ms&lt;/small&gt;&#x27;; $(&#x27;rank&#x27;).textContent=&#x27;再來一輪，牠們跑不掉&#x27;;
    $(&#x27;sum&#x27;).textContent=`拍到 0/${ROUNDS} 隻`; $(&#x27;speedLab&#x27;).textContent=&#x27;你的指速&#x27;;
  }
  $(&#x27;dexEnd&#x27;).textContent=(newFinds.length?&#x27;NEW・&#x27;:&#x27;&#x27;)+&#x27;圖鑑 &#x27;+dexText();
  $(&#x27;dexStart&#x27;).textContent=&#x27;圖鑑 &#x27;+dexText();
  gaEvent(&#x27;game_complete&#x27;,{score:bestShot?bestShot.ms:0,score_unit:&#x27;ms&#x27;,hits:hits.length});
  show(&#x27;end&#x27;); sfx(bestShot?&#x27;finish&#x27;:&#x27;trombone&#x27;);
}

function toast(t){ const el=$(&#x27;toast&#x27;); el.textContent=t; el.classList.add(&#x27;on&#x27;); clearTimeout(el._t); el._t=setTimeout(()=&gt;el.classList.remove(&#x27;on&#x27;),1800); }

// 把拍立得畫成 PNG：組一張獨立 SVG（含角色圖形），畫到 canvas
async function snapshotPNG(){
  const defs=document.querySelector(&#x27;svg.defs&#x27;).innerHTML;
  const c=bestShot.c, ms=(bestShot.ms/1000).toFixed(3), r=rankOf(bestShot.ms);
  const svg=`&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; xmlns:xlink=&quot;http://www.w3.org/1999/xlink&quot; width=&quot;720&quot; height=&quot;900&quot; viewBox=&quot;0 0 720 900&quot;&gt;${defs}
  &lt;rect width=&quot;720&quot; height=&quot;900&quot; fill=&quot;#0B0B0B&quot;/&gt;
  &lt;g transform=&quot;rotate(-3 360 400)&quot;&gt;&lt;rect x=&quot;110&quot; y=&quot;90&quot; width=&quot;500&quot; height=&quot;560&quot; rx=&quot;8&quot; fill=&quot;#F6F6F2&quot;/&gt;&lt;rect x=&quot;134&quot; y=&quot;114&quot; width=&quot;452&quot; height=&quot;420&quot; rx=&quot;4&quot; fill=&quot;#0E120B&quot;/&gt;
  &lt;svg x=&quot;140&quot; y=&quot;120&quot; width=&quot;440&quot; height=&quot;408&quot; viewBox=&quot;0 0 220 160&quot;&gt;&lt;use href=&quot;#${c.face}&quot; xlink:href=&quot;#${c.face}&quot;/&gt;&lt;/svg&gt;
  &lt;text x=&quot;572&quot; y=&quot;520&quot; text-anchor=&quot;end&quot; font-family=&quot;Menlo,monospace&quot; font-size=&quot;22&quot; fill=&quot;#9BE028&quot;&gt;${ms}s&lt;/text&gt;
  &lt;text x=&quot;138&quot; y=&quot;600&quot; font-family=&quot;PingFang TC,Noto Sans TC,sans-serif&quot; font-size=&quot;30&quot; font-weight=&quot;700&quot; fill=&quot;#1A1A1A&quot;&gt;${c.name}・被我抓包&lt;/text&gt;&lt;/g&gt;
  &lt;text x=&quot;360&quot; y=&quot;740&quot; text-anchor=&quot;middle&quot; font-family=&quot;Menlo,monospace&quot; font-size=&quot;64&quot; font-weight=&quot;700&quot; fill=&quot;#9BE028&quot;&gt;${bestShot.ms}ms&lt;/text&gt;
  &lt;text x=&quot;360&quot; y=&quot;790&quot; text-anchor=&quot;middle&quot; font-family=&quot;PingFang TC,Noto Sans TC,sans-serif&quot; font-size=&quot;26&quot; fill=&quot;#F3F3F3&quot;&gt;${r.t}・比 ${r.pct}% 玩家快&lt;/text&gt;
  &lt;text x=&quot;360&quot; y=&quot;850&quot; text-anchor=&quot;middle&quot; font-family=&quot;PingFang TC,Noto Sans TC,sans-serif&quot; font-size=&quot;20&quot; fill=&quot;#9A9A9A&quot;&gt;acer NITRO｜0.1 秒快門&lt;/text&gt;&lt;/svg&gt;`;
  const url=URL.createObjectURL(new Blob([svg],{type:&#x27;image/svg+xml&#x27;}));
  const img=new Image(); await new Promise((res,rej)=&gt;{img.onload=res; img.onerror=rej; img.src=url;});
  const cv=document.createElement(&#x27;canvas&#x27;); cv.width=720; cv.height=900; cv.getContext(&#x27;2d&#x27;).drawImage(img,0,0); URL.revokeObjectURL(url);
  return await new Promise(res=&gt;cv.toBlob(res,&#x27;image/png&#x27;));
}
function showSheet(blob){ $(&#x27;sheetImg&#x27;).src=URL.createObjectURL(blob); $(&#x27;sheet&#x27;).hidden=false; }
$(&#x27;sheetClose&#x27;).onclick=()=&gt;{ $(&#x27;sheet&#x27;).hidden=true; };
$(&#x27;share&#x27;).onclick=async()=&gt;{ gaEvent(&#x27;share_click&#x27;);
  if(!bestShot){ toast(&#x27;這輪沒拍到，再來一輪！&#x27;); return; }
  const text=`我用 ${bestShot.ms}ms 拍到了「${bestShot.c.name}」的奇異表情！你拍得到嗎？`;
  try{ navigator.clipboard.writeText(text).catch(()=&gt;{}); }catch(e){}
  let blob; try{ blob=await snapshotPNG(); }catch(e){ toast(&#x27;已複製分享文字&#x27;); return; }
  const file=new File([blob],&#x27;奇異快照.png&#x27;,{type:&#x27;image/png&#x27;});
  try{ if(navigator.canShare &amp;&amp; navigator.canShare({files:[file]})){ await navigator.share({files:[file],text}); return; } }catch(e){ if(e&amp;&amp;e.name===&#x27;AbortError&#x27;) return; }
  showSheet(blob);
};
$(&#x27;go&#x27;).onclick=start; $(&#x27;again&#x27;).onclick=start; bindSound($(&#x27;snd&#x27;));
$(&#x27;more&#x27;).onclick=()=&gt;gaEvent(&#x27;product_click&#x27;,{product:&#x27;Nitro XZ340CKR P&#x27;,link_url:$(&#x27;more&#x27;).href});
})();
&lt;/script&gt;

function sticker(id, x, y, w, rot, ay=0.5, sym=&#x27;&#x27;){
  const it=ITEMS[id], vb=(it.vb||&#x27;0 0 40 40&#x27;).split(&#x27; &#x27;).map(Number), h=w*vb[3]/vb[2];
  const art = id===&#x27;laptop&#x27; ? `&lt;use href=&quot;#${sym||&#x27;lapGreen&#x27;}&quot;/&gt;` : ART[id];
  return `&lt;g transform=&quot;translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(1)})&quot; class=&quot;sticker&quot;&gt;&lt;svg x=&quot;${(-w/2).toFixed(1)}&quot; y=&quot;${(-h*ay).toFixed(1)}&quot; width=&quot;${w}&quot; height=&quot;${h.toFixed(1)}&quot; viewBox=&quot;${vb.join(&#x27; &#x27;)}&quot; overflow=&quot;visible&quot;&gt;${art}&lt;/svg&gt;&lt;/g&gt;`;
}
// worn = [{id, rot, jx, color}] in tap order; everything stacks, nothing gets replaced
function layout(worn){
  const L={back:[],pet:[],feet:[],waist:[],neck:[],face:[],mouth:[],hand:[],laptop:[],head:[],cloud:[]}, n={};
  let headTop=34;
  for(const it of worn){
    const d=ITEMS[it.id], a=d.a, k=(n[a]=(n[a]||0)+1)-1, r=it.rot, j=it.jx;
    if(a===&#x27;head&#x27;){
      if(it.id===&#x27;dino&#x27; &amp;&amp; k===0){ L.head.push(sticker(&#x27;dino&#x27;,80,50,96,r*.3)); headTop=8; continue; }
      const y=headTop+6; L.head.push(sticker(it.id,80+j,y,d.w,r,.86)); headTop=y-d.w*0.62*0.86; continue; }
    if(a===&#x27;face&#x27;) { L.face.push(sticker(it.id,80+j*.3,65-k*5,d.w,r*.4)); continue; }
    if(a===&#x27;mouth&#x27;){ L.mouth.push(sticker(it.id,80,80+k*4,d.w,r*.5)); continue; }
    if(a===&#x27;neck&#x27;) { L.neck.push(sticker(it.id,80+j*.5,114+k*10,d.w,r*.4,.3)); continue; }
    if(a===&#x27;waist&#x27;){ L.waist.push(sticker(it.id,80,168-k*14,d.w,r*.3)); continue; }
    if(a===&#x27;hand&#x27;){ const right=k%2===0, m=Math.floor(k/2), sx=right?1:-1;
      L.hand.push(sticker(it.id,(right?118:42)+sx*m*12,(d.ay?172:160)-m*10,d.w,sx*(m*14)+r*.5,d.ay||.5)); continue; }
    if(a===&#x27;back&#x27;){ const right=k%2===0, m=Math.floor(k/2), sx=right?1:-1;
      L.back.push(sticker(it.id,80+sx*(34+m*10),120-m*16,d.w,sx*(12+m*8)+r*.3)); continue; }
    if(a===&#x27;feet&#x27;) { L.feet.push(sticker(it.id,80,250-k*3,d.w,r*.3)); continue; }
    if(a===&#x27;pet&#x27;)  { const P=[[0,236],[160,236],[-20,212],[180,212]][k%4]; L.pet.push(sticker(it.id,P[0],P[1]-Math.floor(k/4)*20,d.w,r*.3)); continue; }
    if(a===&#x27;laptop&#x27;){ const P=[[128,196],[32,196],[134,170],[26,170]][k%4]; L.laptop.push(sticker(&#x27;laptop&#x27;,P[0],P[1]-Math.floor(k/4)*24,d.w,r*.4,.5,it.color)); continue; }
    if(a===&#x27;cloud&#x27;){ L.cloud.push({k,r}); continue; }
  }
  const clouds = L.cloud.map(({k,r})=&gt;sticker(&#x27;cloud&#x27;,80+(k%2?1:-1)*Math.ceil(k/2)*30,headTop-22-Math.floor(k/2)*4,60,r*.3)).join(&#x27;&#x27;);
  return {L, clouds, headTop};
}
function totalKg(worn){ return worn.reduce((s,it)=&gt;s+(ITEMS[it.id].g||0),0)/1000; }
function dollSVG(gender, worn, face, cls=&#x27;doll&#x27;){
  const kg=totalKg(worn), squash=Math.min(.08,kg*.0028);
  const {L,clouds,headTop}=layout(worn);
  const top=Math.min(-12, headTop-52);
  const vb=`-44 ${top.toFixed(0)} 248 ${(274-top).toFixed(0)}`;
  return `&lt;svg class=&quot;${cls}&quot; viewBox=&quot;${vb}&quot; preserveAspectRatio=&quot;xMidYMax meet&quot; aria-hidden=&quot;true&quot;&gt;${L.back.join(&#x27;&#x27;)}${L.pet.join(&#x27;&#x27;)}${baseDoll(gender,face,squash)}${L.feet.join(&#x27;&#x27;)}${L.waist.join(&#x27;&#x27;)}${L.neck.join(&#x27;&#x27;)}${L.face.join(&#x27;&#x27;)}${L.mouth.join(&#x27;&#x27;)}${L.hand.join(&#x27;&#x27;)}${L.laptop.join(&#x27;&#x27;)}${L.head.join(&#x27;&#x27;)}${clouds}&lt;/svg&gt;`;
}

<script>

function show(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.id===id));
  document.querySelectorAll('.g').forEach(f=>{ const on=f.id==='g-'+id; f.classList.toggle('on',on); if(on&&!f.srcdoc) f.srcdoc=f.dataset.src; });
  try{history.replaceState(null,'','#'+id)}catch(e){}
  const f=document.getElementById('g-'+id); setTimeout(()=>{try{f.contentWindow.focus()}catch(e){}},50);
}
