 {name:&quot;600ml 不鏽鋼水壺&quot;, sub:&quot;裝滿&quot;, g:1050, art:&#x27;&lt;svg width=&quot;104&quot; height=&quot;146&quot;&gt;&lt;use href=&quot;#bottle&quot;/&gt;&lt;/svg&gt;&#x27;, fixed:true},
 {name:&quot;一包 1kg 白米&quot;, sub:&quot;超市那種&quot;, g:1000, emo:&quot;🍚&quot;, fixed:true, note:&quot;只比 999g 重 1 公克！&quot;},
 {name:&quot;一般 16 吋筆電&quot;, sub:&quot;同尺寸的別台&quot;, g:1900, art:&#x27;&lt;svg width=&quot;150&quot; height=&quot;105&quot;&gt;&lt;use href=&quot;#lap&quot;/&gt;&lt;/svg&gt;&#x27;},
 {name:&quot;一顆鳳梨&quot;, sub:&quot;中型&quot;, g:1500, emo:&quot;🍍&quot;},
 {name:&quot;小玉西瓜&quot;, sub:&quot;一顆&quot;, g:2000, emo:&quot;🍉&quot;},
 {name:&quot;家裡的貓&quot;, sub:&quot;成貓&quot;, g:4500, emo:&quot;🐈&quot;},
 {name:&quot;精裝字典&quot;, sub:&quot;厚的那本&quot;, g:1300, emo:&quot;📕&quot;},
 {name:&quot;時尚雜誌&quot;, sub:&quot;一本&quot;, g:450, emo:&quot;📖&quot;},
 {name:&quot;雞腿便當&quot;, sub:&quot;含飯&quot;, g:650, emo:&quot;🍱&quot;},
 {name:&quot;大杯珍奶&quot;, sub:&quot;全糖去冰&quot;, g:750, emo:&quot;🧋&quot;},
 {name:&quot;一隻球鞋&quot;, sub:&quot;單腳&quot;, g:400, emo:&quot;👟&quot;},
 {name:&quot;智慧型手機&quot;, sub:&quot;一支&quot;, g:200, emo:&quot;📱&quot;},

];
const $ = id =&gt; document.getElementById(id);
const views = {start:$(&#x27;v-start&#x27;), play:$(&#x27;v-play&#x27;), end:$(&#x27;v-end&#x27;)};
function show(v){ for(const k in views) views[k].classList.toggle(&#x27;on&#x27;, k===v); }

// ---------- sound &amp; haptics ----------
let ac=null;
function beep(freqs, dur=0.09, type=&#x27;sine&#x27;, vol=0.06){
  try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    let t = ac.currentTime;
    freqs.forEach(f=&gt;{ const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.value=f;
      g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur); t+=dur*0.9; });
  }catch(e){}
}
const buzz = ms =&gt; { try{ navigator.vibrate &amp;&amp; navigator.vibrate(ms); }catch(e){} };

// ---------- state ----------
let qs=[], idx=0, results=[], left=TOTAL_MS, last=0, running=false, busy=false, raf=0;

function shuffle(a){ for(let i=a.length-1;i&gt;0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pickQuestions(){
  const fixed = POOL.filter(p=&gt;p.fixed), rest = shuffle(POOL.filter(p=&gt;!p.fixed));
  const heavy = rest.filter(p=&gt;p.g&gt;LAPTOP_W), light = rest.filter(p=&gt;p.g&lt;LAPTOP_W);
  // 大約一半一半，避免全猜同一邊
  return shuffle([...fixed, ...heavy.slice(0,3), ...light.slice(0,5)]).slice(0,TOTAL_Q);
}

function start(){
  qs = pickQuestions(); idx=0; results=[]; left=TOTAL_MS; busy=false;
  show(&#x27;play&#x27;); renderDots(); renderStack(); updateClock();
  running=true; last=performance.now(); cancelAnimationFrame(raf); raf=requestAnimationFrame(tick);
  beep([523,659],0.08);
}
function tick(now){
  if(!running) return;
  if(!busy){ left -= now-last; }
  last = now;
  if(left&lt;=0){ left=0; updateClock(); return finish(); }
  updateClock();
  raf=requestAnimationFrame(tick);
}
function updateClock(){
  const s = Math.ceil(left/1000);
  $(&#x27;tleft&#x27;).textContent = &#x27;0:&#x27;+String(s).padStart(2,&#x27;0&#x27;);
  $(&#x27;tbar&#x27;).style.width = (100-left/TOTAL_MS*100)+&#x27;%&#x27;;
  $(&#x27;clock&#x27;).classList.toggle(&#x27;warn&#x27;, left&lt;=5000 &amp;&amp; left&gt;0);
}
function renderDots(){
  $(&#x27;dots&#x27;).innerHTML = qs.map((_,i)=&gt;{
    const r = results[i]; const c = r===true?&#x27;ok&#x27;:r===false?&#x27;ng&#x27;:(i===idx?&#x27;cur&#x27;:&#x27;&#x27;);
    return `&lt;i class=&quot;${c}&quot;&gt;&lt;/i&gt;`; }).join(&#x27;&#x27;);
  $(&#x27;qno&#x27;).textContent = `第 ${Math.min(idx+1,TOTAL_Q)}/${TOTAL_Q} 題`;
}
function cardHTML(q,i){
  const art = q.art ? q.art : `&lt;span class=&quot;emo&quot;&gt;${q.emo}&lt;/span&gt;`;
  return `&lt;span class=&quot;no&quot;&gt;${String(i+1).padStart(2,&#x27;0&#x27;)} / ${TOTAL_Q}&lt;/span&gt;&lt;div class=&quot;art&quot;&gt;${art}&lt;/div&gt;&lt;b&gt;${q.name}・${q.sub}&lt;/b&gt;
   &lt;div class=&quot;vsl&quot;&gt;對上&lt;svg width=&quot;40&quot; height=&quot;28&quot;&gt;&lt;use href=&quot;#lap&quot;/&gt;&lt;/svg&gt;Swift Air 16&lt;/div&gt;
   &lt;span class=&quot;stamp r&quot;&gt;它比較重！&lt;/span&gt;&lt;span class=&quot;stamp l&quot;&gt;筆電比較重！&lt;/span&gt;`;
}
let card=null;
function renderStack(){
  const st=$(&#x27;stack&#x27;); st.innerHTML=&#x27;&#x27;;
  if(idx+2&lt;qs.length){ const b=document.createElement(&#x27;div&#x27;); b.className=&#x27;sc b2&#x27;; st.appendChild(b); }
  if(idx+1&lt;qs.length){ const b=document.createElement(&#x27;div&#x27;); b.className=&#x27;sc b1&#x27;; st.appendChild(b); }
  card=document.createElement(&#x27;div&#x27;); card.className=&#x27;sc cur&#x27;; card.innerHTML=cardHTML(qs[idx],idx); st.appendChild(card);
  const rv=document.createElement(&#x27;div&#x27;); rv.className=&#x27;reveal&#x27;; rv.id=&#x27;reveal&#x27;; st.appendChild(rv);
  bindDrag(card);
}

// ---------- drag / swipe ----------
function setDrag(dx){
  card.style.transform = `translateX(${dx}px) rotate(${dx/14}deg)`;
  const r = card.querySelector(&#x27;.stamp.r&#x27;), l = card.querySelector(&#x27;.stamp.l&#x27;);
  r.style.opacity = Math.max(0,Math.min(1,dx/80)); l.style.opacity = Math.max(0,Math.min(1,-dx/80));
}
function bindDrag(el){
  let sx=0, dx=0, t0=0, active=false, id=null;
  el.addEventListener(&#x27;pointerdown&#x27;, e=&gt;{ if(busy) return; active=true; id=e.pointerId; sx=e.clientX; dx=0; t0=performance.now(); el.classList.add(&#x27;drag&#x27;); el.classList.remove(&#x27;back&#x27;); try{el.setPointerCapture(id);}catch(_){} });
  el.addEventListener(&#x27;pointermove&#x27;, e=&gt;{ if(!active||e.pointerId!==id) return; dx=e.clientX-sx; setDrag(dx); });
  const end = e=&gt;{ if(!active||e.pointerId!==id) return; active=false; el.classList.remove(&#x27;drag&#x27;);
    const v = Math.abs(dx)/Math.max(1,performance.now()-t0);
    if(Math.abs(dx)&gt;90 || (Math.abs(dx)&gt;40 &amp;&amp; v&gt;0.6)) answer(dx&gt;0?&#x27;heavier&#x27;:&#x27;lighter&#x27;);
    else { el.classList.add(&#x27;back&#x27;); setDrag(0); } };
  el.addEventListener(&#x27;pointerup&#x27;, end); el.addEventListener(&#x27;pointercancel&#x27;, end);
}
function answer(choice){
  if(busy||!running) return; busy=true;
  const q=qs[idx], heavier=q.g&gt;LAPTOP_W, ok=(choice===&#x27;heavier&#x27;)===heavier;
  results[idx]=ok;
  // fly out
  card.classList.remove(&#x27;back&#x27;); card.classList.add(&#x27;fly&#x27;);
  const dir = choice===&#x27;heavier&#x27;?1:-1;
  setDrag(dir*60);
  requestAnimationFrame(()=&gt;{ card.style.transform=`translateX(${dir*520}px) rotate(${dir*24}deg)`; card.style.opacity=&#x27;0&#x27;; });
  ok ? (beep([660,880],0.08), buzz(15)) : (beep([180],0.18,&#x27;square&#x27;,0.04), buzz([30,40,30]));
  const rv=$(&#x27;reveal&#x27;); rv.classList.toggle(&#x27;ng&#x27;,!ok);
  const who = heavier ? `${q.name}比較重` : `Swift Air 16 比較重`;
  rv.innerHTML = `&lt;div class=&quot;mark&quot;&gt;${ok?&#x27;✓&#x27;:&#x27;✕&#x27;}&lt;/div&gt;&lt;div class=&quot;rt&quot;&gt;${ok?&#x27;答對！&#x27;:&#x27;差一點！&#x27;}&lt;/div&gt;&lt;div class=&quot;rwho&quot;&gt;${who}&lt;/div&gt;
    &lt;div class=&quot;rw&quot;&gt;${q.name}約 &lt;b&gt;${q.g.toLocaleString()}g&lt;/b&gt;｜Swift Air 16 &lt;b&gt;999g&lt;/b&gt;${q.note?&#x27;&lt;br&gt;&#x27;+q.note:&#x27;&#x27;}&lt;/div&gt;`;
  setTimeout(()=&gt;rv.classList.add(&#x27;on&#x27;),120);
  renderDots();
  setTimeout(()=&gt;{
    idx++;
    if(idx&gt;=TOTAL_Q) return finish();
    busy=false; renderDots(); renderStack();
  }, 1100);
}
$(&#x27;bl&#x27;).onclick=()=&gt;answer(&#x27;lighter&#x27;); $(&#x27;br&#x27;).onclick=()=&gt;answer(&#x27;heavier&#x27;);
document.addEventListener(&#x27;keydown&#x27;,e=&gt;{
  if(!views.play.classList.contains(&#x27;on&#x27;)) return;
  if(e.key===&#x27;ArrowLeft&#x27;) answer(&#x27;lighter&#x27;); if(e.key===&#x27;ArrowRight&#x27;) answer(&#x27;heavier&#x27;);
});

// ---------- result ----------
const STAR=&#x27;&lt;svg width=&quot;24&quot; height=&quot;24&quot; viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M12 2.6l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8Z&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;/svg&gt;&#x27;;
let lastScore=0;
function finish(){
  running=false; cancelAnimationFrame(raf);
  const score = results.filter(r=&gt;r===true).length; lastScore=score;
  const nStar = score&gt;=9?3:score&gt;=6?2:1;
  const [title,say] = score===10?[&#x27;人肉電子秤・滿分&#x27;,&#x27;滿分！你的手就是電子秤&#x27;]
    : score&gt;=8?[&#x27;人肉電子秤&#x27;,&#x27;重量感很準，差一點滿分&#x27;]
    : score&gt;=6?[&#x27;手感不錯&#x27;,&#x27;重量感還不錯，再一輪就滿分&#x27;]
    : score&gt;=4?[&#x27;手感暖機中&#x27;,&#x27;有些東西比你想的還輕&#x27;]
    : [&#x27;萬物皆重&#x27;,&#x27;你覺得什麼都很重，筆電除外&#x27;];
  $(&#x27;score&#x27;).textContent=score; $(&#x27;title&#x27;).textContent=title; $(&#x27;say&#x27;).textContent=say;
  $(&#x27;stars&#x27;).innerHTML=[0,1,2].map(i=&gt;`&lt;span class=&quot;st${i&lt;nStar?&#x27; on&#x27;:&#x27;&#x27;}&quot;&gt;${STAR}&lt;/span&gt;`).join(&#x27;&#x27;);
  $(&#x27;mini&#x27;).innerHTML=Array.from({length:TOTAL_Q},(_,i)=&gt;`&lt;i class=&quot;${results[i]===true?&#x27;ok&#x27;:results[i]===false?&#x27;ng&#x27;:&#x27;&#x27;}&quot;&gt;&lt;/i&gt;`).join(&#x27;&#x27;);
  setTimeout(()=&gt;{ show(&#x27;end&#x27;); beep([523,659,784],0.1); },300);
}
function toast(t){ const el=$(&#x27;toast&#x27;); el.textContent=t; el.classList.add(&#x27;on&#x27;); clearTimeout(el._t); el._t=setTimeout(()=&gt;el.classList.remove(&#x27;on&#x27;),1800); }
$(&#x27;go&#x27;).onclick=start; $(&#x27;again&#x27;).onclick=start;
$(&#x27;share&#x27;).onclick=async()=&gt;{
  const text=`我在「秤重大挑戰」滑對 ${lastScore}/10！原來 Swift Air 16 只有 999g，比裝滿的 600ml 水壺還輕。你猜得出來嗎？`;
  let copied=false; try{ await navigator.clipboard.writeText(text); copied=true; }catch(e){}
  try{ if(navigator.share){ await navigator.share({title:&#x27;秤重大挑戰&#x27;,text}); return; } }catch(e){ if(e&amp;&amp;e.name===&#x27;AbortError&#x27;) return; }
  toast(copied?&#x27;已複製分享文字，貼到 IG／LINE 就好&#x27;:&#x27;分享文字：&#x27;+text.slice(0,18)+&#x27;…&#x27;);
};
$(&#x27;more&#x27;).onclick=()=&gt;toast(&#x27;正式版會連到 Swift Air 16 產品頁&#x27;);
})();
&lt;/script&gt;

.snap .pz .ph{background:#0E120B;border-radius:2px;position:relative}
.snap .pz svg{display:block;width:100%;height:auto}
.snap .pz .cp{display:flex;justify-content:space-between;color:#1A1A1A;font-size:12px;line-height:28px;font-weight:700}
.snap .pz .cp span{color:#5F8A12}
.timer{font-size:48px;line-height:56px;font-weight:700;color:var(--acc);text-shadow:0 0 16px rgba(155,224,40,.4);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.timer small{font-size:20px;color:var(--mute);margin-left:2px}
.timer.idle{color:#3A3A3A;text-shadow:none}
.shutterbar{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.thumb{width:48px;height:48px;border-radius:8px;border:1px solid #333;background:#151515;overflow:hidden;display:flex;align-items:center;justify-content:center}
.thumb svg{display:block}
.shutter{width:88px;height:88px;border-radius:50%;border:3px solid var(--acc);display:flex;align-items:center;justify-content:center;box-shadow:0 0 24px rgba(155,224,40,.35);cursor:pointer;background:none;touch-action:manipulation;padding:0}
.shutter i{width:68px;height:68px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;color:var(--acc-ink);font-style:normal;font-weight:900;font-size:13px;letter-spacing:.06em;transition:transform .08s}
.shutter:active i,.shutter.press i{transform:scale(.86);filter:brightness(.9)}
.dex{display:flex;flex-direction:column;align-items:center;gap:2px;width:48px;font-size:11px;line-height:16px;color:var(--mute)}
.dex b{font-size:14px;color:var(--ink)}
.rounds{display:flex;gap:6px;justify-content:center;margin-top:12px}
.rounds i{width:28px;height:4px;border-radius:2px;background:#2A2A2A}.rounds i.hit{background:var(--acc)}.rounds i.miss{background:#5A2A26}.rounds i.cur{background:#777}
/* result */
.pol{width:228px;margin:16px auto 0;padding:10px 10px 0;background:#F6F6F2;border-radius:4px;transform:rotate(-3deg);box-shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5);position:relative}
.pol .ph{position:relative;height:140px;background:#0E120B;border-radius:2px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.pol .ph svg{display:block}
.pol .cap{display:flex;justify-content:space-between;align-items:center;height:36px;color:#1A1A1A;font-size:13px;line-height:16px;font-weight:700}
.pol .cap span{font-size:11px;color:#8A8A8A;font-weight:400}
.pol .ts{position:absolute;right:8px;bottom:6px;font-size:11px;line-height:16px;color:var(--acc);letter-spacing:.06em}
.tape{position:absolute;top:-10px;left:50%;width:64px;height:20px;margin-left:-32px;background:rgba(155,224,40,.55);transform:rotate(4deg)}
.big{font-size:56px;line-height:56px;font-weight:700;color:var(--acc);letter-spacing:-.03em;text-shadow:0 0 16px rgba(155,224,40,.35);font-variant-numeric:tabular-nums}
.big small{font-size:22px;color:var(--mute);margin-left:2px}
.badge{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:4px;border:1px solid var(--acc);background:rgba(155,224,40,.08);font-weight:700;font-size:13px}
.badge svg{display:block}
.toast{position:absolute;left:50%;bottom:110px;transform:translate(-50%,16px);background:var(--acc);color:var(--acc-ink);font-size:13px;font-weight:700;line-height:20px;padding:8px 16px;border-radius:4px;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sheet{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;background:rgba(0,0,0,.75)}
.sheet[hidden]{display:none}
.sheet img{display:block;max-width:100%;max-height:68%;border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.4)}
.sheet p{color:#fff;font-size:14px;line-height:22px;text-align:center}
.sheet .btn{max-width:200px}

  &lt;svg class=&quot;mystery&quot; style=&quot;position:absolute;left:50%;top:44px;margin-left:-90px&quot; width=&quot;180&quot; height=&quot;112&quot;&gt;&lt;use href=&quot;#fish&quot;/&gt;&lt;/svg&gt;&lt;span class=&quot;qm mono&quot; style=&quot;right:28px;top:20px&quot;&gt;?&lt;/span&gt;&lt;span class=&quot;qm mono&quot; style=&quot;left:24px;bottom:16px;font-size:28px&quot;&gt;?&lt;/span&gt;&lt;/div&gt;

 &lt;div class=&quot;vf&quot; id=&quot;vf&quot; style=&quot;margin-top:12px;flex:1;min-height:200px;max-height:300px&quot;&gt;&lt;i class=&quot;cn a&quot;&gt;&lt;/i&gt;&lt;i class=&quot;cn b&quot;&gt;&lt;/i&gt;&lt;i class=&quot;cn c&quot;&gt;&lt;/i&gt;&lt;i class=&quot;cn d&quot;&gt;&lt;/i&gt;&lt;span class=&quot;rec mono&quot;&gt;&lt;i&gt;&lt;/i&gt;REC&lt;/span&gt;&lt;div class=&quot;xh&quot;&gt;&lt;/div&gt;
  &lt;div id=&quot;runner&quot;&gt;&lt;i class=&quot;streak&quot; style=&quot;top:18px;width:120px&quot;&gt;&lt;/i&gt;&lt;i class=&quot;streak&quot; style=&quot;top:44px;width:150px&quot;&gt;&lt;/i&gt;&lt;i class=&quot;streak&quot; style=&quot;top:72px;width:110px&quot;&gt;&lt;/i&gt;
   &lt;svg class=&quot;g2&quot; viewBox=&quot;0 0 200 124&quot;&gt;&lt;use id=&quot;ug2&quot; href=&quot;#fish&quot;/&gt;&lt;/svg&gt;&lt;svg class=&quot;g1&quot; viewBox=&quot;0 0 200 124&quot;&gt;&lt;use id=&quot;ug1&quot; href=&quot;#fish&quot;/&gt;&lt;/svg&gt;&lt;svg class=&quot;body&quot; viewBox=&quot;0 0 200 124&quot;&gt;&lt;use id=&quot;ub&quot; href=&quot;#fish&quot;/&gt;&lt;/svg&gt;&lt;/div&gt;

 &lt;div class=&quot;top&quot;&gt;&lt;div class=&quot;logo&quot;&gt;acer&lt;span&gt;NITRO&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;chip g mono&quot; id=&quot;dexEnd&quot;&gt;圖鑑 1/3&lt;/span&gt;&lt;/div&gt;
 &lt;div class=&quot;pol&quot;&gt;&lt;i class=&quot;tape&quot;&gt;&lt;/i&gt;&lt;div class=&quot;ph&quot; id=&quot;polPh&quot;&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;&lt;b id=&quot;polName&quot;&gt;飆速鹹魚・被你抓包&lt;/b&gt;&lt;span class=&quot;mono&quot; id=&quot;polNo&quot;&gt;#01&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;c&quot; style=&quot;margin-top:20px&quot;&gt;&lt;div class=&quot;k&quot; id=&quot;speedLab&quot;&gt;你的指速（最快一張）&lt;/div&gt;&lt;div class=&quot;big mono&quot; style=&quot;margin-top:4px&quot; id=&quot;bigMs&quot;&gt;168&lt;small&gt;ms&lt;/small&gt;&lt;/div&gt;
 &lt;div style=&quot;margin-top:8px&quot;&gt;&lt;span class=&quot;badge&quot;&gt;&lt;svg width=&quot;14&quot; height=&quot;16&quot; viewBox=&quot;0 0 14 16&quot;&gt;&lt;path d=&quot;M8.5 0 1 9h5l-1.5 7L13 6.5H8Z&quot; fill=&quot;#9BE028&quot;/&gt;&lt;/svg&gt;&lt;span id=&quot;rank&quot;&gt;神之手指・比 92% 玩家快&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
 &lt;div class=&quot;foot mono&quot; id=&quot;sum&quot; style=&quot;margin-top:8px&quot;&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;card&quot; style=&quot;margin-top:12px&quot;&gt;&lt;p class=&quot;p&quot; style=&quot;color:#DDD&quot;&gt;&lt;b style=&quot;color:var(--acc)&quot;&gt;Nitro 180Hz 每一幀只要 5.6ms&lt;/b&gt;，再快的怪咖都拍得清清楚楚。&lt;/p&gt;&lt;/div&gt;
 &lt;div class=&quot;btns&quot; style=&quot;margin-top:auto;padding-top:16px&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;share&quot;&gt;分享奇異快照&lt;/button&gt;&lt;button class=&quot;btn o mono&quot; id=&quot;again&quot;&gt;AGAIN&lt;/button&gt;&lt;/div&gt;

&lt;div class=&quot;toast&quot; id=&quot;toast&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
(()=&gt;{
const ROUNDS = 5;
const CRITTERS = [
  {id:&#x27;fish&#x27;,   face:&#x27;fishface&#x27;,    name:&#x27;飆速鹹魚&#x27;},
  {id:&#x27;boba&#x27;,   face:&#x27;bobaface&#x27;,    name:&#x27;暴走珍奶&#x27;},
  {id:&#x27;slipper&#x27;,face:&#x27;slipperface&#x27;, name:&#x27;飛天藍白拖&#x27;},
];
const $ = id =&gt; document.getElementById(id);
const views = {start:$(&#x27;v-start&#x27;), play:$(&#x27;v-play&#x27;), end:$(&#x27;v-end&#x27;)};
const show = v =&gt; { for(const k in views) views[k].classList.toggle(&#x27;on&#x27;, k===v); };

let ac=null;
function tone(freqs,dur=0.07,type=&#x27;square&#x27;,vol=0.035){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); let t=ac.currentTime;
  freqs.forEach(f=&gt;{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur);t+=dur*0.9;}); }catch(e){} }
function shutterSound(){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); const n=ac.sampleRate*0.08, b=ac.createBuffer(1,n,ac.sampleRate), d=b.getChannelData(0);
  for(let i=0;i&lt;n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3); const s=ac.createBufferSource(), g=ac.createGain(); g.gain.value=0.25; s.buffer=b; s.connect(g).connect(ac.destination); s.start(); }catch(e){} }
const buzz = ms =&gt; { try{ navigator.vibrate &amp;&amp; navigator.vibrate(ms); }catch(e){} };

// 圖鑑（只存在這台裝置的瀏覽器裡）
let dex = new Set();
try{ dex = new Set(JSON.parse(localStorage.getItem(&#x27;acer-shutter-dex&#x27;)||&#x27;[]&#x27;)); }catch(e){}
const saveDex = () =&gt; { try{ localStorage.setItem(&#x27;acer-shutter-dex&#x27;, JSON.stringify([...dex])); }catch(e){} };
const dexText = () =&gt; `${dex.size}/${CRITTERS.length}`;
$(&#x27;dexStart&#x27;).textContent = &#x27;圖鑑 &#x27;+dexText();

let round=0, shots=[], state=&#x27;idle&#x27;, t0=0, raf=0, waitT=0, nextT=0, critter=null, dur=0, newFinds=[];
const runner=$(&#x27;runner&#x27;), vf=$(&#x27;vf&#x27;);

function setMsg(text, cls){ const m=$(&#x27;msg&#x27;); m.textContent=text; m.className=&#x27;msg on &#x27;+cls; }
function clearMsg(){ $(&#x27;msg&#x27;).className=&#x27;msg&#x27;; }
function setTimer(ms, idle){ $(&#x27;timer&#x27;).innerHTML=(ms/1000).toFixed(3)+&#x27;&lt;small&gt;s&lt;/small&gt;&#x27;; $(&#x27;timer&#x27;).classList.toggle(&#x27;idle&#x27;,!!idle); }
function renderRounds(){
  $(&#x27;rounds&#x27;).innerHTML = Array.from({length:ROUNDS},(_,i)=&gt;{ const s=shots[i]; return `&lt;i class=&quot;${s?(s.ms!=null?&#x27;hit&#x27;:&#x27;miss&#x27;):(i===round?&#x27;cur&#x27;:&#x27;&#x27;)}&quot;&gt;&lt;/i&gt;`; }).join(&#x27;&#x27;);
  $(&#x27;round&#x27;).textContent = `ROUND ${Math.min(round+1,ROUNDS)}/${ROUNDS}`;
  const hits = shots.filter(s=&gt;s&amp;&amp;s.ms!=null).map(s=&gt;s.ms);
  $(&#x27;best&#x27;).textContent = hits.length ? `BEST ${Math.min(...hits)}ms` : &#x27;BEST ---&#x27;;
  $(&#x27;dexPlay&#x27;).textContent = dexText();
}

function start(){
  round=0; shots=[]; newFinds=[]; $(&#x27;thumb&#x27;).innerHTML=&#x27;&#x27;;
  show(&#x27;play&#x27;); renderRounds(); nextRound();
}
function nextRound(){
  clearTimeout(waitT); clearTimeout(nextT); cancelAnimationFrame(raf);
  if(round&gt;=ROUNDS) return finish();
  renderRounds(); $(&#x27;snap&#x27;).classList.remove(&#x27;on&#x27;); runner.style.display=&#x27;none&#x27;; clearMsg();
  state=&#x27;wait&#x27;; setTimer(0,true);
  $(&#x27;status&#x27;).textContent=&#x27;準備……盯著取景框&#x27;;
  setMsg(&#x27;等牠出現…&#x27;,&#x27;wait&#x27;);
  waitT = setTimeout(appear, 1100 + Math.random()*2400);
}
function appear(){
  critter = CRITTERS[Math.floor(Math.random()*CRITTERS.length)];
  [&#x27;ug2&#x27;,&#x27;ug1&#x27;,&#x27;ub&#x27;].forEach(id=&gt;$(id).setAttribute(&#x27;href&#x27;,&#x27;#&#x27;+critter.id));
  dur = 720 - round*45;                     // 一回比一回快
  runner.style.top = (38 + Math.random()*24)+&#x27;%&#x27;;
  runner.style.display=&#x27;block&#x27;; clearMsg();
  state=&#x27;run&#x27;; t0=performance.now();
  $(&#x27;status&#x27;).textContent=&#x27;牠出現了！&#x27;;
  tone([1200],0.03,&#x27;square&#x27;,0.02);
  raf=requestAnimationFrame(run);
}
function run(now){
  if(state!==&#x27;run&#x27;) return;
  const el=now-t0, W=vf.clientWidth, x = -170 + (W+340)*(el/dur);
  runner.style.transform=`translateX(${x}px)`;
  setTimer(el);
  if(el&gt;=dur){ return escaped(); }
  raf=requestAnimationFrame(run);
}
function escaped(){
  state=&#x27;done&#x27;; runner.style.display=&#x27;none&#x27;;
  shots[round]={ms:null, c:critter};
  setMsg(&#x27;跑掉了……只拍到尾巴&#x27;,&#x27;bad&#x27;); $(&#x27;status&#x27;).textContent=&#x27;MISS&#x27;; tone([220,160],0.12);
  buzz(60); round++; nextT=setTimeout(nextRound,1300);
}
function fire(){
  $(&#x27;shutter&#x27;).classList.add(&#x27;press&#x27;); setTimeout(()=&gt;$(&#x27;shutter&#x27;).classList.remove(&#x27;press&#x27;),120);
  if(state===&#x27;wait&#x27;){
    clearTimeout(waitT); state=&#x27;done&#x27;;
    setMsg(&#x27;太早了！拍到空氣&#x27;,&#x27;bad&#x27;); $(&#x27;status&#x27;).textContent=&#x27;再來一次這回合&#x27;; tone([180],0.15); buzz(80);
    nextT=setTimeout(nextRound,1100); return;
  }
  if(state!==&#x27;run&#x27;) return;
  const ms = Math.round(performance.now()-t0);
  state=&#x27;done&#x27;; cancelAnimationFrame(raf);
  shutterSound(); buzz(25);
  const f=$(&#x27;flash&#x27;); f.classList.remove(&#x27;on&#x27;); void f.offsetWidth; f.classList.add(&#x27;on&#x27;);
  setTimer(ms);
  shots[round]={ms, c:critter};
  if(!dex.has(critter.id)){ dex.add(critter.id); newFinds.push(critter.id); saveDex(); }
  $(&#x27;snapUse&#x27;).setAttribute(&#x27;href&#x27;,&#x27;#&#x27;+critter.face); $(&#x27;snapName&#x27;).textContent=critter.name; $(&#x27;snapMs&#x27;).textContent=(ms/1000).toFixed(3)+&#x27;s&#x27;;
  setTimeout(()=&gt;{ runner.style.display=&#x27;none&#x27;; $(&#x27;snap&#x27;).classList.add(&#x27;on&#x27;); },140);
  $(&#x27;status&#x27;).textContent = ms&lt;200?&#x27;神速！&#x27;:ms&lt;260?&#x27;拍到了！&#x27;:&#x27;差點跑掉！&#x27;;
  $(&#x27;thumb&#x27;).innerHTML=`&lt;svg width=&quot;48&quot; height=&quot;35&quot; viewBox=&quot;0 0 220 160&quot;&gt;&lt;use href=&quot;#${critter.face}&quot;/&gt;&lt;/svg&gt;`;
  round++; renderRounds();
  nextT=setTimeout(nextRound,1500);
}
$(&#x27;shutter&#x27;).addEventListener(&#x27;pointerdown&#x27;,e=&gt;{e.preventDefault();fire();});
vf.addEventListener(&#x27;pointerdown&#x27;,e=&gt;{e.preventDefault();fire();});

function rankOf(ms){
  const pct = Math.max(1, Math.min(99, Math.round(100-(ms-140)*0.45)));
  const t = ms&lt;180?&#x27;神之手指&#x27;:ms&lt;230?&#x27;電競反應&#x27;:ms&lt;300?&#x27;正常人類&#x27;:&#x27;樹懶模式&#x27;;
  return {pct,t};
}
let bestShot=null;
function finish(){

async function snapshotPNG(){

  const c=bestShot.c, ms=(bestShot.ms/1000).toFixed(3), r=rankOf(bestShot.ms);

  &lt;text x=&quot;572&quot; y=&quot;520&quot; text-anchor=&quot;end&quot; font-family=&quot;Menlo,monospace&quot; font-size=&quot;22&quot; fill=&quot;#9BE028&quot;&gt;${ms}s&lt;/text&gt;
  &lt;text x=&quot;138&quot; y=&quot;600&quot; font-family=&quot;PingFang TC,Noto Sans TC,sans-serif&quot; font-size=&quot;30&quot; font-weight=&quot;700&quot; fill=&quot;#1A1A1A&quot;&gt;${c.name}・被我抓包&lt;/text&gt;&lt;/g&gt;
  &lt;text x=&quot;360&quot; y=&quot;740&quot; text-anchor=&quot;middle&quot; font-family=&quot;Menlo,monospace&quot; font-size=&quot;64&quot; font-weight=&quot;700&quot; fill=&quot;#9BE028&quot;&gt;${bestShot.ms}ms&lt;/text&gt;
  &lt;text x=&quot;360&quot; y=&quot;790&quot; text-anchor=&quot;middle&quot; font-family=&quot;PingFang TC,Noto Sans TC,sans-serif&quot; font-size=&quot;26&quot; fill=&quot;#F3F3F3&quot;&gt;${r.t}・比 ${r.pct}% 玩家快&lt;/text&gt;
  &lt;text x=&quot;360&quot; y=&quot;850&quot; text-anchor=&quot;middle&quot; font-family=&quot;PingFang TC,Noto Sans TC,sans-serif&quot; font-size=&quot;20&quot; fill=&quot;#9A9A9A&quot;&gt;acer NITRO｜0.1 秒快門&lt;/text&gt;&lt;/svg&gt;`;
  const url=URL.createObjectURL(new Blob([svg],{type:&#x27;image/svg+xml&#x27;}));
  const img=new Image(); await new Promise((res,rej)=&gt;{img.onload=res; img.onerror=rej; img.src=url;});
  const cv=document.createElement(&#x27;canvas&#x27;); cv.width=720; cv.height=900; cv.getContext(&#x27;2d&#x27;).drawImage(img,0,0); URL.revokeObjectURL(url);
  return await new Promise(res=&gt;cv.toBlob(res,&#x27;image/png&#x27;));
}

  try{ navigator.clipboard.writeText(text).catch(()=&gt;{}); }catch(e){}

};

function layout(worn){

      const y=headTop+6; L.head.push(sticker(it.id,80+j,y,d.w,r,.86)); headTop=y-d.w*0.62*0.86; continue; }
    if(a===&#x27;face&#x27;) { L.face.push(sticker(it.id,80+j*.3,65-k*5,d.w,r*.4)); continue; }
    if(a===&#x27;mouth&#x27;){ L.mouth.push(sticker(it.id,80,80+k*4,d.w,r*.5)); continue; }
    if(a===&#x27;neck&#x27;) { L.neck.push(sticker(it.id,80+j*.5,114+k*10,d.w,r*.4,.3)); continue; }
    if(a===&#x27;waist&#x27;){ L.waist.push(sticker(it.id,80,168-k*14,d.w,r*.3)); continue; }
    if(a===&#x27;hand&#x27;){ const right=k%2===0, m=Math.floor(k/2), sx=right?1:-1;
      L.hand.push(sticker(it.id,(right?118:42)+sx*m*12,(d.ay?172:160)-m*10,d.w,sx*(m*14)+r*.5,d.ay||.5)); continue; }
    if(a===&#x27;back&#x27;){ const right=k%2===0, m=Math.floor(k/2), sx=right?1:-1;
      L.back.push(sticker(it.id,80+sx*(34+m*10),120-m*16,d.w,sx*(12+m*8)+r*.3)); continue; }
    if(a===&#x27;feet&#x27;) { L.feet.push(sticker(it.id,80,250-k*3,d.w,r*.3)); continue; }
    if(a===&#x27;pet&#x27;)  { const P=[[0,236],[160,236],[-20,212],[180,212]][k%4]; L.pet.push(sticker(it.id,P[0],P[1]-Math.floor(k/4)*20,d.w,r*.3)); continue; }
    if(a===&#x27;laptop&#x27;){ const P=[[128,196],[32,196],[134,170],[26,170]][k%4]; L.laptop.push(sticker(&#x27;laptop&#x27;,P[0],P[1]-Math.floor(k/4)*24,d.w,r*.4,.5,it.color)); continue; }

}

function tapItem(b){
  if(!running || b.classList.contains(&#x27;gone&#x27;)) return;
  clearTimeout(b._t1); clearTimeout(b._t2); b.classList.add(&#x27;gone&#x27;); setTimeout(()=&gt;b.remove(),200);
  const id=b.dataset.id, it=ITEMS[id], x=parseFloat(b.style.left), y=parseFloat(b.style.top);
  const f=document.createElement(&#x27;div&#x27;); f.className=&#x27;fly&#x27;; f.innerHTML=b.innerHTML; f.style.left=x+&#x27;px&#x27;; f.style.top=y+&#x27;px&#x27;; stage.appendChild(f);
  const ap=anchorPoint(); requestAnimationFrame(()=&gt;{ f.style.left=ap.x+&#x27;px&#x27;; f.style.top=ap.y+&#x27;px&#x27;; f.style.transform=&#x27;scale(.6)&#x27;; });
  setTimeout(()=&gt;f.remove(),270);
  const now=performance.now();
  if(it.bad){
    streak=0; $(&#x27;streak&#x27;).textContent=&#x27;連穿 ×0&#x27;;
    worn.push({id, rot:(Math.random()*2-1)*10, jx:0});
    setScore(score+it.p); plus(`${it.name} ${it.p}`,x,y-20,true); say(it.line);
    faceOverride=&#x27;sad&#x27;; clearTimeout(faceT); faceT=setTimeout(()=&gt;{faceOverride=null; renderDoll();},1400);
    tone(220,140,.25,&#x27;square&#x27;,.04); buzz([40,30,40]);
    setTimeout(renderDoll,200); return;
  }
  streak = (now-lastTap&lt;1100) ? streak+1 : 1; lastTap=now;
  const pts=Math.round(it.p*(1+Math.min(streak-1,10)*0.1));
  const entry={id, rot:(Math.random()*2-1)*12, jx:(Math.random()*2-1)*4};
  if(id===&#x27;laptop&#x27;){ entry.color=b.dataset.color; lapColor=LAP_COLORS.find(c=&gt;c.sym===b.dataset.color); }
  worn.push(entry);
  setScore(score+pts); $(&#x27;streak&#x27;).textContent=`連穿 ×${streak}`;
  plus(`+${pts}`,x,y-20);
  if(id===&#x27;laptop&#x27;){ banner(&#x27;接到了！&#x27;,`Swift Air 14 ${lapColor.name}`,&#x27;go&#x27;); say(&#x27;只有 1.19kg，好輕！&#x27;); tone(880,1760,.25,&#x27;triangle&#x27;,.07); }
  else if(it.line &amp;&amp; Math.random()&lt;.7) say(it.line);
  tone(500+Math.min(streak,12)*60, 900+Math.min(streak,12)*80, .1); buzz(12);
  const kg=totalKg(worn);
  for(const [t,l] of [[5,&#x27;有點重……&#x27;],[10,&#x27;我還撐得住！&#x27;],[15,&#x27;腰要斷了&#x27;],[20,&#x27;這是搬家吧？&#x27;]]){ if(kg&gt;=t &amp;&amp; kgSaid&lt;t){ kgSaid=t; say(l); } }
  setTimeout(()=&gt;{ renderDoll(); checkCombos(); },200);
}
function checkCombos(){
  const w={}; for(const it of worn){ w[it.id]=(w[it.id]||0)+1; if(ITEMS[it.id].a===&#x27;head&#x27;) w._head=(w._head||0)+1; }
  for(const c of COMBOS){
    if(found.includes(c.id) || !c.need(w)) continue;
    found.push(c.id); const isNew=!dex.has(c.id); dex.add(c.id); saveDex();
    setScore(score+c.bonus); banner(isNew?&#x27;NEW COMBO！&#x27;:&#x27;COMBO！&#x27;,`${c.name} +${c.bonus}`);
    tone(660,1320,.18,&#x27;triangle&#x27;,.07); setTimeout(()=&gt;tone(990,1980,.2,&#x27;triangle&#x27;,.06),140); buzz([20,40,20]);
    renderFoundDots(); $(&#x27;hint&#x27;).textContent=`找到「${c.name}」！`;
    break;
  }
}
function end(){
  running=false; clearTimeout(spawnT); clearTimeout(tickT);
  stage.querySelectorAll(&#x27;.sp&#x27;).forEach(b=&gt;{ clearTimeout(b._t1); clearTimeout(b._t2); b.classList.add(&#x27;gone&#x27;); });
  $(&#x27;timer&#x27;).textContent=&#x27;⏰ 0:00&#x27;; $(&#x27;timer&#x27;).classList.remove(&#x27;warn&#x27;);
  banner(&#x27;時間到&#x27;,&#x27;出門！&#x27;,&#x27;go&#x27;); tone(523,784,.2,&#x27;triangle&#x27;,.06);
  setTimeout(result,1200);
}

// ---------- result ----------
let res=null;
function result(){
  const n=worn.filter(w=&gt;!ITEMS[w.id].bad).length, kg=totalKg(worn), bads=worn.length-n;
  const best=COMBOS.filter(c=&gt;found.includes(c.id)).sort((a,b)=&gt;b.bonus-a.bonus)[0];
  const title = best ? best.name+&#x27;系&#x27; : n&gt;=16?&#x27;全身家當系&#x27;:n&gt;=10?&#x27;行動倉庫系&#x27;:n&gt;=5?&#x27;隨手一抓系&#x27;:n&gt;=1?&#x27;輕裝出門系&#x27;:&#x27;什麼都沒穿系&#x27;;
  res={title,n,kg,col:lapColor};
  $(&#x27;title&#x27;).textContent=title;
  $(&#x27;endStage&#x27;).innerHTML=dollSVG(gender,worn,kg&gt;=18?&#x27;dizzy&#x27;:&#x27;proud&#x27;);
  $(&#x27;sN&#x27;).textContent=n; $(&#x27;sKg&#x27;).textContent=kg.toFixed(1); $(&#x27;sR&#x27;).textContent=score.toLocaleString()+&#x27;%&#x27;;
  $(&#x27;combos&#x27;).innerHTML=COMBOS.map(c=&gt;{ const got=found.includes(c.id), known=dex.has(c.id); return `&lt;span class=&quot;${got?&#x27;on new&#x27;:known?&#x27;on&#x27;:&#x27;&#x27;}&quot;&gt;${known?c.name:&#x27;？？？&#x27;}&lt;/span&gt;`; }).join(&#x27;&#x27;);
  const heavy = kg&gt;=1.19 ? `全身扛了 ${kg.toFixed(1)}kg 出門，還好 &lt;b&gt;Swift Air 14 只有 1.19kg&lt;/b&gt;。` : `&lt;b&gt;Swift Air 14 只有 1.19kg&lt;/b&gt;，帶著出門剛剛好。`;
  const colTxt = lapColor ? `你接到的&lt;span class=&quot;match&quot; style=&quot;background:${lapColor.hex}&quot;&gt;&lt;/span&gt;&lt;b&gt;${lapColor.name}&lt;/b&gt;就是你的本命色。` : `下次接住那台發光的 Swift Air 14，看看你的本命色。`;
  $(&#x27;copy&#x27;).innerHTML = heavy + (bads?`（還順手接了 ${bads} 通加班，辛苦了。）`:&#x27;&#x27;) + &#x27;&lt;br&gt;&#x27; + colTxt;
  show(&#x27;end&#x27;); tone(660,990,.15); setTimeout(()=&gt;tone(990,1320,.2),150);
}
function toast(t){ const el=$(&#x27;toast&#x27;); el.textContent=t; el.classList.add(&#x27;on&#x27;); clearTimeout(el._t); el._t=setTimeout(()=&gt;el.classList.remove(&#x27;on&#x27;),1800); }
async function storyPNG(){
  const defs=document.querySelector(&#x27;svg.defs&#x27;).innerHTML, W=1080, H=1920, r=res;
  const doll=dollSVG(gender,worn,r.kg&gt;=18?&#x27;dizzy&#x27;:&#x27;proud&#x27;,&#x27;x&#x27;).replace(&#x27;&lt;svg class=&quot;x&quot;&#x27;,&#x27;&lt;svg x=&quot;90&quot; y=&quot;420&quot; width=&quot;900&quot; height=&quot;1000&quot;&#x27;);
  const svg=`&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; xmlns:xlink=&quot;http://www.w3.org/1999/xlink&quot; width=&quot;${W}&quot; height=&quot;${H}&quot; viewBox=&quot;0 0 ${W} ${H}&quot;&gt;${defs}
  &lt;style&gt;.sticker{filter:drop-shadow(0 4px 6px rgba(59,47,51,.18))}&lt;/style&gt;
  &lt;rect width=&quot;${W}&quot; height=&quot;${H}&quot; fill=&quot;#FAF7F2&quot;/&gt;&lt;circle cx=&quot;980&quot; cy=&quot;200&quot; r=&quot;380&quot; fill=&quot;${PINK}&quot;/&gt;&lt;circle cx=&quot;60&quot; cy=&quot;1700&quot; r=&quot;420&quot; fill=&quot;${GREEN}&quot;/&gt;
  &lt;text x=&quot;540&quot; y=&quot;230&quot; text-anchor=&quot;middle&quot; font-family=&quot;PingFang TC,Noto Sans TC,sans-serif&quot; font-size=&quot;40&quot; letter-spacing=&quot;8&quot; fill=&quot;#8C7F84&quot;&gt;今日出門鑑定&lt;/text&gt;
  &lt;text x=&quot;540&quot; y=&quot;330&quot; text-anchor=&quot;middle&quot; font-family=&quot;PingFang TC,Noto Sans TC,sans-serif&quot; font-size=&quot;84&quot; font-weight=&quot;900&quot; fill=&quot;${INK}&quot;&gt;${r.title}&lt;/text&gt;
  ${doll}
  &lt;text x=&quot;540&quot; y=&quot;1520&quot; text-anchor=&quot;middle&quot; font-family=&quot;PingFang TC,Noto Sans TC,sans-serif&quot; font-size=&quot;44&quot; font-weight=&quot;700&quot; fill=&quot;${INK}&quot;&gt;身上 ${r.n} 件｜負重 ${r.kg.toFixed(1)}kg｜回頭率 ${score.toLocaleString()}%&lt;/text&gt;
  &lt;text x=&quot;540&quot; y=&quot;1600&quot; text-anchor=&quot;middle&quot; font-family=&quot;PingFang TC,Noto Sans TC,sans-serif&quot; font-size=&quot;38&quot; fill=&quot;${BURG}&quot;&gt;${r.col?`我的本命色：Swift Air 14 ${r.col.name}`:&#x27;還好 Swift Air 14 只有 1.19kg&#x27;}&lt;/text&gt;
  &lt;text x=&quot;540&quot; y=&quot;1790&quot; text-anchor=&quot;middle&quot; font-family=&quot;Arial,sans-serif&quot; font-size=&quot;56&quot; font-weight=&quot;900&quot; fill=&quot;#83B81A&quot;&gt;acer&lt;/text&gt;&lt;/svg&gt;`;
  const url=URL.createObjectURL(new Blob([svg],{type:&#x27;image/svg+xml&#x27;}));
  const img=new Image(); await new Promise((ok,no)=&gt;{img.onload=ok; img.onerror=no; img.src=url;});
  const cv=document.createElement(&#x27;canvas&#x27;); cv.width=W; cv.height=H; cv.getContext(&#x27;2d&#x27;).drawImage(img,0,0); URL.revokeObjectURL(url);
  return await new Promise(ok=&gt;cv.toBlob(ok,&#x27;image/png&#x27;));
}
function showSheet(blob){ $(&#x27;sheetImg&#x27;).src=URL.createObjectURL(blob); $(&#x27;sheet&#x27;).hidden=false; }
$(&#x27;sheetClose&#x27;).onclick=()=&gt;{ $(&#x27;sheet&#x27;).hidden=true; };
$(&#x27;save&#x27;).onclick=async()=&gt;{
  const text=`我今天是「${res.title}」，身上掛了 ${res.n} 件出門！`;
  try{ navigator.clipboard.writeText(text).catch(()=&gt;{}); }catch(e){}
  let blob; try{ blob=await storyPNG(); }catch(e){ toast(&#x27;存圖失敗，再試一次&#x27;); return; }
  const file=new File([blob],&#x27;今天穿這樣出門.png&#x27;,{type:&#x27;image/png&#x27;});
  try{ if(navigator.canShare&amp;&amp;navigator.canShare({files:[file]})){ await navigator.share({files:[file],text}); return; } }catch(e){ if(e&amp;&amp;e.name===&#x27;AbortError&#x27;) return; }
  showSheet(blob);
};
$(&#x27;gF&#x27;).onclick=()=&gt;{ gender=&#x27;f&#x27;; renderStart(); };
$(&#x27;gM&#x27;).onclick=()=&gt;{ gender=&#x27;m&#x27;; renderStart(); };
$(&#x27;go&#x27;).onclick=start; $(&#x27;again&#x27;).onclick=start;
renderStart();
})();
&lt;/script&gt;

<script>
// 遊戲只在第一次切過去時才載入，切換時保留進度
function show(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.id===id));
  document.querySelectorAll('.g').forEach(f=>{ const on=f.id==='g-'+id; f.classList.toggle('on',on); if(on&&!f.srcdoc) f.srcdoc=f.dataset.src; });
  try{history.replaceState(null,'','#'+id)}catch(e){}
  const f=document.getElementById('g-'+id); setTimeout(()=>{try{f.contentWindow.focus()}catch(e){}},50);
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>show(t.dataset.id)));
const h=(location.hash||'').slice(1); show(document.getElementById('g-'+h)?h:'A2');
</script>
